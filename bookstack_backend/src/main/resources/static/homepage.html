<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BookStack Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --bg: #f5f5f7;
      --white: #ffffff;
      --primary: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #f5a623;
      --radius: 12px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* NAVBAR */
    nav {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    nav .logo {
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--primary);
    }

    nav .nav-links {
      display: flex;
      gap: 20px;
    }

    nav a {
      text-decoration: none;
      color: var(--primary);
      font-size: 0.95rem;
    }

    nav a:hover {
      opacity: 0.7;
    }

    /* HERO SECTION */
    .hero {
      padding: 80px 20px;
      text-align: center;
      max-width: 700px;
      margin: 0 auto;
    }

    .hero h1 {
      font-size: 2.4rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 12px;
    }

    .hero p {
      font-size: 1rem;
      color: var(--muted);
      margin-bottom: 24px;
    }

    .hero .cta-btn {
      padding: 12px 22px;
      background: var(--primary);
      color: var(--white);
      border: none;
      border-radius: var(--radius);
      font-size: 1rem;
      cursor: pointer;
    }

    .hero .cta-btn:hover {
      opacity: 0.9;
    }

    /* FEATURED SECTION */
    .featured {
      padding: 40px 20px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .featured h2 {
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 20px;
    }

    .book-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
    }

    .book-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.9rem;
    }

    /* FOOTER */
    footer {
      margin-top: auto;
      padding: 20px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>

<body>

  <nav>
    <div class="logo">BookStack</div>
    <div class="nav-links">
      <a href="#">Browse</a>
      <a href="#">Login</a>
      <a href="#">Register</a>
    </div>
  </nav>

  <section class="hero">
    <h1>Discover Your Next Favorite Book</h1>
    <p>Browse thousands of titles from independent sellers and trusted authors.</p>
    <button class="cta-btn">Start Browsing</button>
  </section>

  <section class="featured">
    <h2>Featured Books</h2>
    <div class="book-grid">
      <div class="book-card">Book Placeholder</div>
      <div class="book-card">Book Placeholder</div>
      <div class="book-card">Book Placeholder</div>
      <div class="book-card">Book Placeholder</div>
    </div>
  </section>

  <footer>
    © 2026 BookStack
  </footer>

</body>
</html>
