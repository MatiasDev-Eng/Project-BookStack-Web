<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publish a Book | BookStack</title>
    <link rel="stylesheet" href="style.css">
    <script>
        (function() {
            const cached = localStorage.getItem('bookstack-theme');
            if (cached === 'dark') document.documentElement.classList.add('dark');
        })();
    </script>
    <style>
        /* Fix for hidden content: ensuring content shows if preload is stuck */
        body.preload { opacity: 0; }
        body { transition: opacity 0.2s ease-in; opacity: 1; }

        .cover-upload-area {
            border: 2px dashed var(--border);
            border-radius: var(--radius);
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            position: relative;
        }
        .cover-upload-area:hover { border-color: var(--accent); background: var(--bg-subtle); }
        .cover-upload-area.has-image { border-style: solid; border-color: var(--success); padding: 0; overflow: hidden; }
        #coverPreview { display: none; width: 100%; max-height: 260px; object-fit: cover; }
        .cover-upload-area.has-image #coverPreview  { display: block; }
        .cover-upload-area.has-image .upload-placeholder { display: none; }
        #coverFileInput { display: none; }
        .cover-change-hint { display: none; font-size: 0.78rem; color: var(--muted); margin-top: 6px; text-align: center; }
        .cover-upload-area.has-image + .cover-change-hint { display: block; }
    </style>
</head>

<body class="preload">
<div id="notification"></div>

<nav>
    <div class="nav-left"><a href="homepage.html" class="logo">BookStack</a></div>
    <div class="nav-right">
        <div class="nav-icon-btn" onclick="window.location.href='homepage.html'">🏠</div>
        <div class="nav-icon-btn" onclick="window.location.href='account.html'">👤</div>
    </div>
</nav>

<div class="container">
    <div class="header-section">
        <h1>Seller Dashboard</h1>
        <p style="color: var(--muted)">List your book and upload a cover in one go.</p>
    </div>

    <div class="form-card">
        <form id="publishForm">
            <div class="form-group">
                <label>Cover Image</label>
                <div class="cover-upload-area" id="coverUploadArea" onclick="document.getElementById('coverFileInput').click()">
                    <img id="coverPreview" alt="Cover preview">
                    <div class="upload-placeholder">
                        <div class="upload-icon">📷</div>
                        <p>Click to upload</p>
                    </div>
                </div>
                <p class="cover-change-hint">Click to change</p>
                <input type="file" id="coverFileInput" accept="image/*">
            </div>

            <div class="form-group">
                <label for="title">Book Title</label>
                <input type="text" id="title" required>
            </div>

            <div class="form-group">
                <label for="author">Author</label>
                <input type="text" id="author" required>
            </div>

            <div class="form-group">
                <label for="isbn">ISBN</label>
                <input type="text" id="isbn" required>
            </div>

            <div class="form-row">
                <div class="form-group"><label>Genre</label><input type="text" id="genre" required></div>
                <div class="form-group"><label>Edition</label><input type="text" id="edition"></div>
            </div>

            <div class="form-row">
                <div class="form-group"><label>Year</label><input type="number" id="year" required></div>
                <div class="form-group"><label>Price ($)</label><input type="number" id="price" step="0.01" required></div>
                <div class="form-group"><label>Stock</label><input type="number" id="stock" value="1" required></div>
            </div>

            <div class="form-group">
                <label>Condition</label>
                <select id="condition" required>
                    <option value="">Select Condition</option>
                    <option value="NEW">New</option>
                    <option value="LIKE_NEW">Like New</option>
                    <option value="GOOD">Good</option>
                </select>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea id="description" rows="4"></textarea>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Post Listing</button>
        </form>
    </div>
</div>

<script>
    const API_BASE = `${window.location.origin}/api`;

    // ─── VISIBILITY & THEME ───
    async function initPage() {
        const cached = localStorage.getItem('bookstack-theme');
        if (cached) {
            const isDark = cached === 'dark';
            document.body.classList.toggle("dark", isDark);
            document.documentElement.classList.toggle("dark", isDark);
        }

        try {
            const res = await fetch(`${API_BASE}/me/`, { credentials: 'include' });
            if (res.ok) {
                const user   = await res.json();
                const theme  = (user.themePreference || "light").toLowerCase().trim();
                const isDark = theme === "dark";
                localStorage.setItem('bookstack-theme', theme);
                document.body.classList.toggle("dark", isDark);
                document.documentElement.classList.toggle("dark", isDark);
            }
        } catch (err) {
            console.warn("Theme fetch failed, using cache");
        } finally {
            document.body.classList.remove('preload');
        }
    }
    initPage();

    // ─── IMAGE PREVIEW ───
    document.getElementById('coverFileInput').addEventListener('change', function () {
        const file = this.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            document.getElementById('coverPreview').src = e.target.result;
            document.getElementById('coverUploadArea').classList.add('has-image');
        };
        reader.readAsDataURL(file);
    });

    // ─── FORM SUBMIT ───
    document.getElementById('publishForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Publishing...';

        const bookData = {
            ownerId: Number(localStorage.getItem('bookstack-user-id')),
            stock: parseInt(document.getElementById('stock').value),
            price: parseFloat(document.getElementById('price').value),
            title: document.getElementById('title').value,
            author: document.getElementById('author').value,
            genre: document.getElementById('genre').value,
            edition: document.getElementById('edition').value,
            condition: document.getElementById('condition').value,
            publishedYear: parseInt(document.getElementById('year').value),
            description: document.getElementById('description').value,
            isbn: document.getElementById('isbn').value
        };

        const formData = new FormData();
        formData.append('book', new Blob([JSON.stringify(bookData)], { type: 'application/json' }));

        const fileInput = document.getElementById('coverFileInput');
        if (fileInput.files[0]) {
            formData.append('cover', fileInput.files[0]);
        }

        try {
            const response = await fetch(`${API_BASE}/books/`, {
                method: 'POST',
                body: formData,
                credentials: 'include'
            });

            if (response.ok) {
                alert('Book published successfully!');
                window.location.href = 'homepage.html';
            } else {
                const err = await response.json();
                alert('Error: ' + (err.message || 'Failed to save'));
            }
        } catch (error) {
            console.error(error);
            alert('Connection error.');
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Post Listing';
        }
    });
</script>
</body>
</html>
