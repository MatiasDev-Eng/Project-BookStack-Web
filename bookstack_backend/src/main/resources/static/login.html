<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookstack Login</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f4f7f6; }
        .login-card { background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 350px; }
        h2 { margin-top: 0; color: #2c3e50; text-align: center; }
        .form-group { margin-bottom: 1.2rem; }
        label { display: block; margin-bottom: 0.5rem; color: #555; font-size: 0.9rem; }
        input { width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; transition: border-color 0.3s; }
        input:focus { outline: none; border-color: #3498db; }
        button { width: 100%; padding: 0.75rem; background-color: #3498db; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: bold; }
        button:hover { background-color: #2980b9; }

        #message { display: none; margin-top: 1.5rem; padding: 0.75rem; border-radius: 6px; text-align: center; font-size: 0.9rem; }
        .success { display: block !important; background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { display: block !important; background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Bookstack Sign In</h2>
    <form id="loginForm">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter username" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter password" required>
        </div>
        <button type="submit" id="submitBtn">Sign In</button>
    </form>

    <div id="message"></div>
</div>

<script>
    const loginForm = document.getElementById('loginForm');
    const messageDiv = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        // Reset UI
        messageDiv.className = "";
        messageDiv.textContent = "Processing...";
        submitBtn.disabled = true;

        const payload = {
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
        };

        try {
            const response = await fetch('http://localhost:8080/api/auth/signin/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'include',
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                const userData = await response.json();
                localStorage.setItem('bookstack-user-id', userData.userId);

                messageDiv.textContent = "Login Successful! Welcome back.";
                messageDiv.className = "success";

                setTimeout(() => {
                    window.location.href = 'homepage.html';
                }, 1000);
                loginForm.reset();
            } else {
                // Try to get error message from backend if available
                const errorData = await response.text();
                messageDiv.textContent = "Login Failed: " + (errorData || "Invalid credentials");
                messageDiv.className = "error";
            }
        } catch (error) {
            messageDiv.textContent = "Server Error: Could not connect to backend.";
            messageDiv.className = "error";
        } finally {
            submitBtn.disabled = false;
        }
    });
</script>

</body>
</html>
