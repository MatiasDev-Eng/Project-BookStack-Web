<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Product Approval | Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css">
    <script>
        (function() {
            const cached = localStorage.getItem('bookstack-theme');
            if (cached === 'dark') document.documentElement.classList.add('dark');
        })();
    </script>
</head>

<body class="preload">

<div id="notification"></div>

<aside class="sidebar">
    <div class="sidebar-title">BookStack</div>
    <nav class="nav">
        <a href="admin_usermanagement.html" class="nav-item">User Approval</a>
        <a href="admin_bookmanagement.html" class="nav-item active">Product Approval</a>
        <a href="admin_viewusers.html" class="nav-item">Active Users</a>
        <a href="admin_viewbooks.html" class="nav-item">Active Books</a>
        <a href="admin_logs.html" class="nav-item">Audit Logs</a>
        <a href="homepage.html" class="nav-item">Back to Store</a>
    </nav>
</aside>

<main class="main">
    <div class="header">Product Approval</div>

    <div class="card">
        <div class="card-title">Books Awaiting Publication</div>

        <table class="table">
            <thead>
            <tr>
                <th>Book Info</th>
                <th>Author</th>
                <th>Price</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody id="bookTableBody">
            <tr>
                <td colspan="4" class="empty-state">Loading pending products...</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<script>
    const API_BASE   = `${window.location.origin}/api`;
    const ADMIN_BASE = `${window.location.origin}/api/admin/books`;

    fetch(`${API_BASE}/auth/me/`, { credentials: "include" })
        .then(res => { if (!res.ok) { window.location.href = "index.html"; return; } return res.json(); })
        .then(user => { if (!user.roles.includes("ROLE_ADMIN")) window.location.href = "404.html"; })
        .catch(() => { window.location.href = "index.html"; });

    function showNotification(message, type = "info") {
        const note = document.getElementById("notification");
        note.innerText = message;
        note.className = `notification-${type}`;
        note.style.display = "block";
        setTimeout(() => note.style.display = "none", 3000);
    }

    async function fetchUnapprovedBooks() {
        const tbody = document.getElementById('bookTableBody');
        try {
            const response = await fetch(`${ADMIN_BASE}/`, { method: 'GET', credentials: 'include' });
            if (response.status === 403) { showNotification("Access Denied: Admin role required.", "error"); return; }
            if (!response.ok) throw new Error("Failed to load books.");
            renderBooks(await response.json());
        } catch (err) {
            console.error(err);
            tbody.innerHTML = `<tr><td colspan="4" class="empty-state" style="color: var(--error);">Error: ${err.message}</td></tr>`;
        }
    }

    function renderBooks(books) {
        const tbody = document.getElementById('bookTableBody');

        if (!books || books.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="empty-state">No products awaiting approval.</td></tr>';
            return;
        }

        tbody.innerHTML = books.map(book => `
            <tr>
                <td>
                    ${book.hasCover
            ? `<img src="${window.location.origin}/api/admin/books/${book.bookId}/cover"
                                alt="${book.title}"
                                style="width: 48px; height: 64px; object-fit: cover; border-radius: 4px; border: 1px solid var(--border); vertical-align: middle; margin-right: 12px;"
                                onerror="this.style.display='none'">`
            : `<span style="font-size: 1.8rem; vertical-align: middle; margin-right: 12px;">📖</span>`
        }
                    <span style="font-weight: 700; vertical-align: middle;">${book.title}</span>
                    <div class="book-meta">ID: #${book.bookId} &nbsp;·&nbsp; ${book.ownerUsername}</div>
                </td>
                <td>${book.author}</td>
                <td style="font-weight: 600; color: var(--success);">$${book.price.toFixed(2)}</td>
                <td>
                    <button class="btn-action approve" onclick="approveBook(${book.bookId}, '${book.title.replace(/'/g, "\\'")}')">
                        Approve Book
                    </button>
                    <button class="btn-action delete-btn" onclick="rejectBook(${book.bookId}, '${book.title.replace(/'/g, "\\'")}')">
                        Reject Book
                    </button>
                </td>
            </tr>
        `).join('');
    }

    async function approveBook(bookId, bookTitle) {
        try {
            const response = await fetch(`${ADMIN_BASE}/${bookId}/approve/`, { method: 'PUT', credentials: 'include' });
            if (response.ok) { showNotification(`"${bookTitle}" has been approved!`, "success"); fetchUnapprovedBooks(); }
            else showNotification("Failed to approve book.", "error");
        } catch (err) { showNotification("Server error during approval.", "error"); }
    }

    async function rejectBook(bookId, bookTitle) {
        if (!confirm(`Are you sure you want to reject "${bookTitle}"?`)) return;
        try {
            const response = await fetch(`${ADMIN_BASE}/${bookId}/reject/`, { method: 'DELETE', credentials: 'include' });
            if (response.ok) { showNotification(`"${bookTitle}" has been rejected and removed.`, "info"); fetchUnapprovedBooks(); }
            else showNotification("Failed to reject book.", "error");
        } catch (err) { showNotification("Server error during rejection.", "error"); }
    }

    async function applyTheme() {
        const cached = localStorage.getItem('bookstack-theme');
        if (cached) {
            const isDark = cached === 'dark';
            document.body.classList.toggle("dark", isDark);
            document.documentElement.classList.toggle("dark", isDark);
        }
        const hasCookie = document.cookie.includes('bookstack-jwt');
        if (!hasCookie) { document.body.classList.remove("preload"); return; }
        try {
            const res   = await fetch(`${API_BASE}/me/`, { credentials: 'include' });
            if (!res.ok) { document.body.classList.remove("preload"); return; }
            const user  = await res.json();
            const theme = (user.themePreference || "light").toLowerCase().trim();
            const isDark = theme === "dark";
            localStorage.setItem('bookstack-theme', theme);
            document.body.classList.toggle("dark", isDark);
            document.documentElement.classList.toggle("dark", isDark);
        } catch (err) { console.error("Theme load failed", err); }
        document.body.classList.remove("preload");
    }

    document.addEventListener('DOMContentLoaded', fetchUnapprovedBooks);
    applyTheme();
</script>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
<script src="notifications.js"></script>
<script src="global-init.js"></script>
</body>
</html>
