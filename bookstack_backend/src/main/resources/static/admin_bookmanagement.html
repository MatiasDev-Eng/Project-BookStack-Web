<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Product Approval | Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css">
    <script>
        // Apply theme instantly from cache to prevent white flash
        (function() {
        const cached = localStorage.getItem('bookstack-theme');
        if (cached === 'dark') document.documentElement.classList.add('dark');
        })();
    </script>
</head>

<body class="preload">

<div id="notification"></div>

<aside class="sidebar">
    <div class="sidebar-title">BookStack</div>
    <nav class="nav">
        <a href="admin_usermanagement.html" class="nav-item">User Approval</a>
        <a href="admin_bookmanagement.html" class="nav-item active">Product Approval</a>
        <a href="homepage.html" class="nav-item">Back to Store</a>
    </nav>
</aside>

<main class="main">
    <div class="header">Product Approval</div>

    <div class="card">
        <div class="card-title">Books Awaiting Publication</div>

        <table class="table">
            <thead>
            <tr>
                <th>Book Info</th>
                <th>Author</th>
                <th>Price</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody id="bookTableBody">
            <tr>
                <td colspan="4" class="empty-state">Loading pending products...</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<script>
    fetch(`${window.location.origin}/api/auth/me/`, {
        credentials: "include"
    })
    .then(res => {
        if (!res.ok) {
            window.location.href = "index.html";
            return;
        }
        return res.json();
    })
    .then(user => {
        if (!user.roles.includes("ROLE_ADMIN")) {
            window.location.href = "404.html";
        }
    })
    .catch(() => {
        window.location.href = "index.html";
    });


    const API_BASE = `${window.location.origin}/api/admin/books`;

    function showNotification(message, type = "info") {
        const note = document.getElementById("notification");
        note.innerText = message;
        note.className = `notification-${type}`;
        note.style.display = "block";

        setTimeout(() => {
            note.style.display = "none";
        }, 3000);
    }

    async function fetchUnapprovedBooks() {
        const tbody = document.getElementById('bookTableBody');

        try {
            const response = await fetch(`${API_BASE}/`, {
                method: 'GET',
                credentials: 'include'
            });

            if (response.status === 403) {
                showNotification("Access Denied: Admin role required.", "error");
                return;
            }

            if (!response.ok) throw new Error("Failed to load books.");

            const books = await response.json();
            renderBooks(books);
        } catch (err) {
            console.error(err);
            tbody.innerHTML = `<tr><td colspan="4" class="empty-state" style="color: var(--error);">Error: ${err.message}</td></tr>`;
        }
    }

    function renderBooks(books) {
        const tbody = document.getElementById('bookTableBody');

        if (!books || books.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="empty-state">No products awaiting approval.</td></tr>';
            return;
        }

        tbody.innerHTML = books.map(book => `
        <tr>
          <td>
            <div style="font-weight: 700;">${book.title}</div>
            <div class="book-meta">ID: #${book.bookId}</div>
          </td>
          <td>${book.author}</td>
          <td style="font-weight: 600; color: var(--success);">$${book.price.toFixed(2)}</td>
          <td>
            <button class="btn-action approve" onclick="approveBook(${book.bookId}, '${book.title.replace(/'/g, "\\'")}')">
              Approve Book
            </button>
          </td>
        </tr>
      `).join('');
    }

    async function approveBook(bookId, bookTitle) {
        try {
            const response = await fetch(`${API_BASE}/${bookId}/approve/`, {
                method: 'PUT',
                credentials: 'include'
            });

            if (response.ok) {
                showNotification(`"${bookTitle}" has been approved!`, "success");
                fetchUnapprovedBooks();
            } else {
                showNotification("Failed to approve book.", "error");
            }
        } catch (err) {
            console.error(err);
            showNotification("Server error during approval.", "error");
        }
    }

    document.addEventListener('DOMContentLoaded', fetchUnapprovedBooks);

    async function applyTheme() {
        // Don't attempt if no JWT cookie present
        const hasCookie = document.cookie.includes('bookstack-jwt');
        if (!hasCookie) {
            document.body.classList.remove("preload");
            return;
        }

        try {
            const res = await fetch(`${API_BASE}/me/`, { credentials: 'include' });
            if (!res.ok) {
                document.body.classList.remove("preload");
                return;
            }
            const user = await res.json();
            const theme = user.themePreference || "light";
            localStorage.setItem('bookstack-theme', theme);
            document.body.classList.toggle("dark", theme === "dark");
        } catch (err) {
            console.error("Theme load failed", err);
        }
        document.body.classList.remove("preload");
    }

    applyTheme();

</script>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
<script src="notifications.js"></script>
<script src="global-init.js"></script>
</body>
</html>
