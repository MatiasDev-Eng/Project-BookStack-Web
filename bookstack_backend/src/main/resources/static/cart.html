<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Your Cart | BookStack</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #f8fafc;
      --white: #ffffff;
      --primary: #1e293b;
      --border: #e2e8f0;
      --accent: #2563eb;
      --danger: #ef4444;
      --radius: 12px;
    }

    body { background: var(--bg); font-family: system-ui, sans-serif; padding: 40px 5%; }
    .cart-container { max-width: 900px; margin: 0 auto; background: var(--white); padding: 30px; border-radius: var(--radius); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .cart-title { font-size: 1.8rem; font-weight: 700; margin-bottom: 20px; color: var(--primary); }

    table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
    th { text-align: left; padding: 12px; border-bottom: 2px solid var(--border); color: #64748b; font-size: 0.9rem; text-transform: uppercase; }
    td { padding: 16px 12px; border-bottom: 1px solid var(--border); }

    .qty-input { width: 50px; padding: 5px; border: 1px solid var(--border); border-radius: 4px; text-align: center; }
    .remove-btn { color: var(--danger); background: none; border: none; cursor: pointer; font-weight: 600; }
    .remove-btn:hover { text-decoration: underline; }

    .cart-summary { display: flex; justify-content: flex-end; gap: 20px; font-size: 1.2rem; padding-top: 20px; }
    .checkout-btn { background: var(--accent); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 10px; float: right; }
  </style>
</head>

<body>
<div class="cart-container">
  <div class="cart-title">Your Shopping Cart</div>

  <table>
    <thead>
    <tr>
      <th>Book</th>
      <th>Price</th>
      <th>Qty</th>
      <th>Total</th>
      <th>Action</th>
    </tr>
    </thead>
    <tbody id="cartTableBody">
    </tbody>
  </table>

  <div class="cart-summary">
    <strong>Total:</strong>
    <span id="totalAmount">$0.00</span>
  </div>
  <button class="checkout-btn">Proceed to Checkout</button>
</div>

<script>
  async function fetchCart() {
    try {
      const response = await fetch('http://localhost:8080/api/cart/', {
        credentials: 'include'
      });
      const items = await response.json();
      renderCart(items);
    } catch (err) {
      console.error("Failed to load cart", err);
    }
  }

  function renderCart(items) {
    const tbody = document.getElementById('cartTableBody');
    const totalSpan = document.getElementById('totalAmount');
    tbody.innerHTML = '';
    let grandTotal = 0;

    items.forEach(item => {
      const itemTotal = item.price * item.quantity;
      grandTotal += itemTotal;

      tbody.innerHTML += `
          <tr>
            <td><strong>${item.title}</strong></td>
            <td>$${item.price.toFixed(2)}</td>
            <td>
              <input type="number" class="qty-input" value="${item.quantity}" 
                     onchange="updateQty(${item.cartItemId}, this.value)" min="1">
            </td>
            <td>$${itemTotal.toFixed(2)}</td>
            <td><button class="remove-btn" onclick="removeItem(${item.cartItemId})">Remove</button></td>
          </tr>
        `;
    });

    totalSpan.innerText = `$${grandTotal.toFixed(2)}`;
  }

  async function updateQty(itemId, newQty) {
    await fetch(`http://localhost:8080/api/cart/update-quantity/${itemId}?quantity=${newQty}`, {
      method: 'PUT',
      credentials: 'include'
    });
    fetchCart(); // Refresh
  }

  async function removeItem(itemId) {
    if(!confirm("Remove this item?")) return;
    await fetch(`http://localhost:8080/api/cart/remove/${itemId}`, {
      method: 'DELETE',
      credentials: 'include'
    });
    fetchCart(); // Refresh
  }

  document.addEventListener('DOMContentLoaded', fetchCart);
</script>
</body>
</html>
