<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Bookstack Sign Up</title>
    <link rel="stylesheet" href="style.css">
    <script>
        // Apply theme instantly from cache to prevent white flash
        (function() {
        const cached = localStorage.getItem('bookstack-theme');
        if (cached === 'dark') document.documentElement.classList.add('dark');
        })();
    </script>
</head>
<body class="preload">

<div class="login-card">
    <h2>Create Account</h2>
    <form id="signupForm">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Min 3 characters" minlength="3" maxlength="20" required>
        </div>
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="email@example.com" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Min 6 characters" minlength="6" maxlength="40" required>
        </div>
        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Repeat password" required>
        </div>
        
        <button type="submit" id="submitBtn">Sign Up</button>
    </form>

    <div id="message"></div>
    
    <div class="login-link">
        Already have an account? <a href="login.html">Sign In</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>

<script src="notifications.js"></script>
<script src="global-init.js"></script>


<script>
    const API_BASE = `${window.location.origin}/api`;
    const signupForm = document.getElementById('signupForm');
    const messageDiv = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');

    signupForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        // Basic client-side validation for password match
        if (password !== confirmPassword) {
            messageDiv.textContent = "Passwords do not match!";
            messageDiv.className = "error";
            return;
        }

        // Reset UI
        messageDiv.className = "";
        messageDiv.textContent = "Creating account...";
        submitBtn.disabled = true;

        const payload = {
            username: username,
            email: email,
            password: password,
            role: ["user"] // Defaulting to 'user' role
        };

        try {
            const response = await fetch(`${API_BASE}/auth/signup/`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                messageDiv.textContent = "Registration successful! You can now log in.";
                messageDiv.className = "success";
                signupForm.reset();
            } else {
                const errorData = await response.text();
                messageDiv.textContent = "Signup Failed: " + (errorData || "Check your details");
                messageDiv.className = "error";
            }
        } catch (error) {
            messageDiv.textContent = "Server Error: Could not connect to backend.";
            messageDiv.className = "error";
        } finally {
            submitBtn.disabled = false;
        }
    });
    async function applyTheme() {
      try {
          const res = await fetch(`${API_BASE}/me/`, { credentials: 'include' });
          if (!res.ok) return;

          const user = await res.json();
          const theme = user.themePreference || "light";
          localStorage.setItem('bookstack-theme', theme);

          document.body.classList.toggle("dark", theme === "dark");
      } catch (err) {
          console.error("Theme load failed", err);
      }
      document.body.classList.remove("preload");
    }

    applyTheme();
</script>

</body>
</html>
