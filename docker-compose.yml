version: '3.8'

services:
  db:
    image: postgres:16.9
    container_name: bookstack-db
    environment:
      POSTGRES_DB: bookstack_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: ./bookstack_backend
      dockerfile: Dockerfile
    container_name: bookstack-app
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/bookstack_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # You can override other properties from application.properties here
      # BOOKSTACK_APP_JWTSECRET: ${JWT_SECRET:-Zy6teVRrvRrTxnXMwQy6awYO0VYs4U/cGruwYjAkr6Q7XPiFH6ysI8+/hRqLn4g4MwG3eemfN1/MoJuYGOHiSw==}
    ports:
      - "9091:9091"
    restart: always

  localtunnel:
    image: ngrok/ngrok:latest
    command: http app:9091
    environment:
      NGROK_AUTHTOKEN: 3D2cH3Tr5gefpifjD5usPF4jwEy_3GMjn1GNL9PSymTq67ivE
    ports:
      - "4040:4040"

volumes:
  postgres_data:

