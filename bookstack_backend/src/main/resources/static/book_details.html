<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Details | BookStack</title>
    <link rel="stylesheet" href="style.css">
    <script>
        (function() {
            const cached = localStorage.getItem('bookstack-theme');
            if (cached === 'dark') document.documentElement.classList.add('dark');
        })();
    </script>
    <style>
        .book-cover-img {
            width: 100%;
            max-width: 100%;
            height: 260px;
            object-fit: cover;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-md);
            display: block;
        }
        .user-profile-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: none;
        }
        .user-profile-btn.has-photo img        { display: block; }
        .user-profile-btn.has-photo .nav-emoji { display: none; }

        /* Style for the report button */
        .report-btn {
            width: 100%;
            background: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 10px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            margin-top: 5px;
        }
        .report-btn:hover {
            background: var(--danger);
            color: white;
        }
    </style>
</head>

<body class="preload">
<div id="notification"></div>

<nav>
    <div class="nav-left">
        <a href="homepage.html" class="logo">BookStack</a>
    </div>

    <div class="nav-center">
        <input id="searchInput" type="text" class="search-bar" placeholder="Search for titles, authors, or genres...">
        <button id="searchBtn" class="search-button">Search</button>
        <button id="filterBtn" class="filter-toggle">Filters</button>
    </div>

    <div class="nav-right">
        <a href="admin_usermanagement.html" id="adminBtn" class="publish-btn admin-btn" style="display: none;">
            🛡️ Admin
        </a>
        <a href="publish_book.html" class="publish-btn"><span>+</span> Publish Book</a>
        <div class="nav-icon-btn" onclick="window.location.href='wishlist.html'">❤️</div>
        <div class="nav-icon-btn" onclick="window.location.href='cart.html'">🛒</div>
        <div class="user-profile-btn" onclick="window.location.href='account.html'">
            <img id="navAvatar" alt="Profile">
            <span class="nav-emoji">👤</span>
        </div>
    </div>
</nav>

<div id="filterPanel" class="filter-panel">
    <h3>Filters</h3>
    <label>Min Price</label>
    <input type="number" id="minPrice" placeholder="0">
    <label>Max Price</label>
    <input type="number" id="maxPrice" placeholder="100">
    <label>Min Year</label>
    <input type="number" id="minYear" placeholder="1900">
    <label>Max Year</label>
    <input type="number" id="maxYear" placeholder="2025">
    <button id="applyFiltersBtn">Apply Filters</button>
    <button id="clearFiltersBtn" class="clear-btn">Clear Filters</button>
</div>

<div class="container" id="bookDetailsContainer">
    <p style="text-align:center; color: var(--muted);">Loading book details...</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
<script src="notifications.js"></script>
<script src="global-init.js"></script>

<script>
    const API_BASE = `${window.location.origin}/api`;
    const params = new URLSearchParams(window.location.search);
    const bookId = params.get("id");
    let bookStockGlobal = 1;
    let selectedRating = 0;
    const ratingLabels = ['', 'Poor', 'Fair', 'Good', 'Very Good', 'Excellent'];

    // ── Notification ──────────────────────────────────────────
    function showNotification(message, type = "info") {
        const note = document.getElementById("notification");
        note.innerText = message;
        note.className = `notification-${type}`;
        note.style.display = "block";
        setTimeout(() => { note.style.display = "none"; }, 3000);
    }

    async function checkAdminStatus() {
        try {
            const res = await fetch(`${API_BASE}/auth/me/`, { credentials: 'include' });
            if (res.ok) {
                const user = await res.json();
                if (user.roles && user.roles.includes('ROLE_ADMIN')) {
                    document.getElementById('adminBtn').style.display = 'flex';
                }
                try {
                    const picRes = await fetch(`${API_BASE}/me/profile-picture`, { credentials: 'include' });
                    if (picRes.ok) {
                        const blob       = URL.createObjectURL(await picRes.blob());
                        const navAvatar  = document.getElementById('navAvatar');
                        const profileBtn = document.querySelector('.user-profile-btn');
                        navAvatar.src    = blob;
                        navAvatar.onload = () => profileBtn.classList.add('has-photo');
                    }
                } catch (e) { /* no picture */ }
            }
        } catch (e) {
            console.warn("Admin check failed:", e);
        }
    }

    // ── Condition label helper ────────────────────────────────
    function formatCondition(condition) {
        if (!condition) return "Not specified";
        const map = {
            "NEW":        "New",
            "LIKE_NEW":   "Like New",
            "VERY_GOOD":  "Very Good",
            "GOOD":       "Good",
            "ACCEPTABLE": "Acceptable"
        };
        return map[condition.toUpperCase()] || condition;
    }

    // ── Star rating helpers ───────────────────────────────────
    function selectStar(val) {
        selectedRating = val;
        document.querySelectorAll('#starSelector span').forEach(star => {
            const starVal = parseInt(star.dataset.val);
            star.style.color     = starVal <= val ? 'var(--accent)' : 'var(--border)';
            star.style.transform = starVal === val ? 'scale(1.2)' : 'scale(1)';
        });
        document.getElementById('ratingLabel').textContent =
            `${val} star${val !== 1 ? 's' : ''} — ${ratingLabels[val]}`;
        document.getElementById('submitReviewBtn').disabled = false;
    }

    async function submitReview() {
        const btn    = document.getElementById('submitReviewBtn');
        const result = document.getElementById('reviewResult');
        btn.disabled    = true;
        btn.textContent = 'Submitting...';

        try {
            const res = await fetch(`${API_BASE}/books/${bookId}/review?rating=${selectedRating}`, {
                method: 'POST',
                credentials: 'include'
            });

            if (res.ok) {
                const data = await res.json();
                result.style.color   = 'var(--success)';
                result.textContent   = `Thanks! New average: ${data.averageRating} / 5 (${data.reviewCount} review${data.reviewCount !== 1 ? 's' : ''})`;
                btn.textContent      = '✓ Submitted';
            } else if (res.status === 401) {
                result.style.color   = 'var(--danger)';
                result.textContent   = 'Please log in to submit a review.';
                btn.disabled         = false;
                btn.textContent      = 'Submit Rating';
            } else if (res.status === 409) {
                result.style.color = 'var(--danger)';
                result.textContent = 'You have already reviewed this book.';
                btn.textContent = 'Already Reviewed';
            } else {
                result.style.color   = 'var(--danger)';
                result.textContent   = 'Failed to submit. Please try again.';
                btn.disabled         = false;
                btn.textContent      = 'Submit Rating';
            }
        } catch (err) {
            result.style.color   = 'var(--danger)';
            result.textContent   = 'Network error. Please try again.';
            btn.disabled         = false;
            btn.textContent      = 'Submit Rating';
        }
    }

    // ── Load main book ────────────────────────────────────────
    async function loadBook() {
        if (!bookId) {
            document.getElementById("bookDetailsContainer").innerHTML =
                `<p style="text-align:center; color: var(--danger);">No book ID provided.</p>`;
            return;
        }

        try {
            const res = await fetch(`${API_BASE}/books/${bookId}`, { credentials: 'include' });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const book = await res.json();

            const condition   = book.condition    || book.bookCondition || book.conditionType || null;
            const description = book.description  || book.desc          || book.summary       || null;
            const price       = book.price        != null ? `$${parseFloat(book.price).toFixed(2)}` : "N/A";
            const author      = book.author       || book.authorName    || "Unknown Author";
            const title       = book.title        || "Untitled";
            const year        = book.publishedYear || book.year         || book.publicationYear || null;
            const genre       = book.genre        || book.category      || null;
            const isbn        = book.isbn         || null;
            const stock = book.stock ?? 0;
            bookStockGlobal = stock;

            document.title = `${title} | BookStack`;

            const avgRating = book.reviewCount > 0
                ? (book.totalScore / book.reviewCount).toFixed(1)
                : null;

            const filledStars = avgRating ? Math.round(parseFloat(avgRating)) : 0;
            const starsDisplay = avgRating
                ? `<span style="color: var(--accent); font-size: 1.2rem; letter-spacing: 2px;">${'★'.repeat(filledStars)}${'☆'.repeat(5 - filledStars)}</span>
                   <span style="color: var(--muted); font-size: 0.9rem;">${avgRating} / 5 &nbsp;·&nbsp; ${book.reviewCount} review${book.reviewCount !== 1 ? 's' : ''}</span>`
                : `<span style="color: var(--muted); font-size: 0.9rem;">No reviews yet</span>`;

            const coverHTML = book.hasCover
                ? `<img src="${API_BASE}/books/${bookId}/cover"
                        alt="${title}"
                        class="book-cover-img"
                        onerror="this.parentElement.innerHTML='<div class=\\'book-cover\\' style=\\'height:260px;border-radius:var(--radius);border:1px solid var(--border);font-size:5rem;\\'>📖</div>'">`
                : `<div class="book-cover" style="height:260px; border-radius:var(--radius); border:1px solid var(--border); font-size:5rem;">📖</div>`;

            document.getElementById("bookDetailsContainer").innerHTML = `
                <a href="homepage.html" class="nav-link">← Back to Books</a>

                <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 32px; margin-top: 8px;">

                    <!-- Cover + actions -->
                    <div>
                        ${coverHTML}
                        <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 10px;">
                            ${stock > 0 ? `
                                <div style="font-size: 0.8rem; font-weight: 700; color: var(--success); margin-bottom: 4px;">
                                    In Stock: ${stock}
                                </div>
                                <div class="quantity-selector">
                                    <button class="qty-btn" onclick="updateQty(this, -1)">−</button>
                                    <span class="qty-num" id="qty-detail">1</span>
                                    <button class="qty-btn" onclick="updateQty(this, 1)">+</button>
                                </div>
                                <button class="submit-btn" style="width:100%;" onclick="addToCart()">🛒 Add to Cart</button>
                            ` : `
                                <div style="text-align:center; padding:16px; background:var(--danger-bg); border:1px solid var(--danger); border-radius:var(--radius-sm); color:var(--danger); font-weight:700;">
                                    Out of Stock
                                </div>
                            `}
                            <button class="add-new-btn" style="width:100%; background:var(--bg-subtle); color:var(--primary); border:1px solid var(--border);" onclick="addToWishlist()">❤️ Add to Wishlist</button>

                            <!-- Report Button -->
                            <button class="report-btn" onclick="reportBook()">🚩 Report Inappropriate</button>
                        </div>
                    </div>

                    <!-- Info -->
                    <div>
                        <h1 style="margin-bottom: 6px;">${title}</h1>
                        <p style="font-size: 1.05rem; color: var(--muted); margin-bottom: 10px;">
                            by <strong style="color: var(--primary);">${author}</strong>
                        </p>

                        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 20px;">
                            ${starsDisplay}
                        </div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px;">
                            <div class="card" style="margin:0; padding: 16px;">
                                <div class="balance-label">Price</div>
                                <div style="font-size: 1.6rem; font-weight: 800; color: var(--price);">${price}</div>
                            </div>
                            <div class="card" style="margin:0; padding: 16px;">
                                <div class="balance-label">Condition</div>
                                <div style="font-size: 1.1rem; font-weight: 700; color: var(--primary);">${formatCondition(condition)}</div>
                            </div>
                            ${year ? `
                            <div class="card" style="margin:0; padding: 16px;">
                                <div class="balance-label">Year</div>
                                <div style="font-size: 1.1rem; font-weight: 700; color: var(--primary);">${year}</div>
                            </div>` : ''}
                            ${genre ? `
                            <div class="card" style="margin:0; padding: 16px;">
                                <div class="balance-label">Genre</div>
                                <div style="font-size: 1.1rem; font-weight: 700; color: var(--primary);">${genre}</div>
                            </div>` : ''}
                            ${isbn ? `
                            <div class="card" style="margin:0; padding: 16px; grid-column: span 2;">
                                <div class="balance-label">ISBN</div>
                                <div style="font-size: 0.95rem; font-weight: 600; color: var(--muted); font-family: monospace;">${isbn}</div>
                            </div>` : ''}
                        </div>

                        ${description ? `
                        <div>
                            <h2 style="margin-bottom: 10px;">Description</h2>
                            <p style="color: var(--muted); line-height: 1.7;">${description}</p>
                        </div>` : ''}
                    </div>
                </div>

                <!-- Review widget -->
                <div style="margin-top: 32px; padding: 24px; background: var(--bg-subtle); border-radius: var(--radius); border: 1px solid var(--border);">
                    <h2 style="margin-bottom: 6px;">Rate This Book</h2>
                    <p style="color: var(--muted); font-size: 0.9rem; margin-bottom: 16px;">Click a star to leave your rating</p>
                    <div id="starSelector" style="display: flex; gap: 6px; margin-bottom: 12px;">
                        ${[1,2,3,4,5].map(n => `
                            <span
                                data-val="${n}"
                                onclick="selectStar(${n})"
                                onmouseover="hoverStar(${n})"
                                onmouseout="unhoverStar()"
                                style="font-size: 2.2rem; cursor: pointer; transition: transform 0.1s, color 0.1s; color: var(--border); user-select: none;">★</span>
                        `).join('')}
                    </div>
                    <p id="ratingLabel" style="color: var(--muted); font-size: 0.9rem; margin-bottom: 14px; min-height: 1.2em;">
                        Select a star rating above
                    </p>
                    <button id="submitReviewBtn"
                            class="submit-btn"
                            style="width: auto; padding: 10px 28px;"
                            disabled
                            onclick="submitReview()">
                        Submit Rating
                    </button>
                    <p id="reviewResult" style="margin-top: 12px; font-size: 0.9rem; min-height: 1.2em;"></p>
                </div>

                <!-- Similar books -->
                <div style="margin-top: 40px;">
                    <h2 style="margin-bottom: 16px;">More Like This</h2>
                    <div id="similar-books" class="similar-books-container">
                        <p style="color: var(--muted);">Loading similar books...</p>
                    </div>
                </div>
            `;

            loadSimilarBooks();

        } catch (err) {
            console.error("Failed to load book:", err);
            document.getElementById("bookDetailsContainer").innerHTML =
                `<p style="text-align:center; color: var(--danger);">Failed to load book details. Please try again.</p>`;
        }
    }

    // ── Report Logic ──────────────────────────────────────────
    async function reportBook() {
        if (!confirm("Are you sure you want to report this book for inappropriate content?")) return;

        try {
            const res = await fetch(`${API_BASE}/report/book/${bookId}`, {
                method: 'POST',
                credentials: 'include'
            });

            if (res.ok) {
                showNotification("Report submitted successfully.", "success");
            } else if (res.status === 401) {
                showNotification("Please log in to report content.", "error");
            } else {
                showNotification("Failed to submit report.", "error");
            }
        } catch (err) {
            showNotification("Network error. Please try again.", "error");
        }
    }

    function hoverStar(val) {
        document.querySelectorAll('#starSelector span').forEach(star => {
            const starVal = parseInt(star.dataset.val);
            star.style.color = starVal <= val ? 'var(--accent)' : 'var(--border)';
        });
    }

    function unhoverStar() {
        document.querySelectorAll('#starSelector span').forEach(star => {
            const starVal = parseInt(star.dataset.val);
            star.style.color = starVal <= selectedRating ? 'var(--accent)' : 'var(--border)';
        });
    }

    async function loadSimilarBooks() {
        try {
            const res = await fetch(`${API_BASE}/books/${bookId}/similar`, { credentials: 'include' });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const books = await res.json();

            const container = document.getElementById("similar-books");
            if (!books || books.length === 0) {
                container.innerHTML = `<p style="color: var(--muted);">No similar books found.</p>`;
                return;
            }

            container.innerHTML = "";
            books.forEach(book => {
                const card = document.createElement("div");
                card.className = "similar-book-card";
                card.onclick = () => { window.location.href = `book_details.html?id=${book.bookId}`; };
                card.innerHTML = `
                    <div style="font-size: 2rem; margin-bottom: 8px;">📖</div>
                    <p style="font-weight: 700; color: var(--primary); margin-bottom: 4px;">${book.title}</p>
                    <p style="font-size: 0.85rem; color: var(--muted); margin-bottom: 6px;">${book.author}</p>
                    <p style="font-weight: 800; color: var(--price);">$${parseFloat(book.price).toFixed(2)}</p>
                `;
                container.appendChild(card);
            });
        } catch (err) {
            const container = document.getElementById("similar-books");
            if (container) container.innerHTML = `<p style="color: var(--muted);">Could not load similar books.</p>`;
        }
    }

    function updateQty(btn, delta) {
        const qtySpan = document.getElementById('qty-detail');
        const stock   = bookStockGlobal;
        let qty = parseInt(qtySpan.innerText);
        qty = Math.max(1, Math.min(stock, qty + delta));
        qtySpan.innerText = qty;
    }

    async function addToCart() {
        const qty = parseInt(document.getElementById('qty-detail').innerText);
        try {
            const res = await fetch(`${API_BASE}/cart/add/`, {
                method: 'POST',
                credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ bookId: parseInt(bookId), quantity: qty })
            });
            if (res.ok) {
                showNotification("Added to cart!", "success");
            } else if (res.status === 401) {
                showNotification("Please log in to add items to cart.", "error");
            } else {
                showNotification("Failed to add to cart.", "error");
            }
        } catch (err) {
            showNotification("Network error. Please try again.", "error");
        }
    }

    async function addToWishlist() {
        try {
            const res = await fetch(`${API_BASE}/wishlist/add/`, {
                method: 'POST',
                credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ bookId: parseInt(bookId) })
            });
            if (res.ok) {
                showNotification("Added to wishlist!", "success");
            } else if (res.status === 401) {
                showNotification("Please log in to save to wishlist.", "error");
            } else {
                showNotification("Failed to add to wishlist.", "error");
            }
        } catch (err) {
            showNotification("Network error. Please try again.", "error");
        }
    }

    document.getElementById("searchBtn").addEventListener("click", () => {
        const query = document.getElementById("searchInput").value.trim();
        window.location.href = `homepage.html?search=${encodeURIComponent(query)}`;
    });

    document.getElementById("searchInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
            const query = document.getElementById("searchInput").value.trim();
            window.location.href = `homepage.html?search=${encodeURIComponent(query)}`;
        }
    });

    document.getElementById("filterBtn").addEventListener("click", () => {
        document.getElementById("filterPanel").classList.toggle("open");
    });

    document.getElementById("applyFiltersBtn").addEventListener("click", () => {
        const query    = document.getElementById("searchInput").value.trim();
        const minPrice = document.getElementById("minPrice").value || null;
        const maxPrice = document.getElementById("maxPrice").value || null;
        const minYear  = document.getElementById("minYear").value  || null;
        const maxYear  = document.getElementById("maxYear").value  || null;

        let url = `homepage.html?search=${encodeURIComponent(query)}`;
        if (minPrice) url += `&minPrice=${minPrice}`;
        if (maxPrice) url += `&maxPrice=${maxPrice}`;
        if (minYear)  url += `&minYear=${minYear}`;
        if (maxYear)  url += `&maxYear=${maxYear}`;
        window.location.href = url;
    });

    document.getElementById("clearFiltersBtn").addEventListener("click", () => {
        window.location.href = `homepage.html`;
    });

    async function applyTheme() {
        const cached = localStorage.getItem('bookstack-theme');
        if (cached) {
            const isDark = cached === 'dark';
            document.body.classList.toggle("dark", isDark);
            document.documentElement.classList.toggle("dark", isDark);
        }

        const hasCookie = document.cookie.includes('bookstack-jwt');
        if (!hasCookie) {
            document.body.classList.remove("preload");
            return;
        }
        try {
            const res = await fetch(`${API_BASE}/me/`, { credentials: 'include' });
            if (!res.ok) { document.body.classList.remove("preload"); return; }
            const user   = await res.json();
            const theme  = (user.themePreference || "light").toLowerCase().trim();
            const isDark = theme === "dark";
            localStorage.setItem('bookstack-theme', theme);
            document.body.classList.toggle("dark", isDark);
            document.documentElement.classList.toggle("dark", isDark);
        } catch (err) {
            console.error("Theme load failed", err);
        }
        document.body.classList.remove("preload");
    }

    applyTheme();
    checkAdminStatus();
    loadBook();
</script>
</body>
</html>
