<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Books | Admin</title>
    <link rel="stylesheet" href="style.css">
    <script>
        (function() {
            const cached = localStorage.getItem('bookstack-theme');
            if (cached === 'dark') document.documentElement.classList.add('dark');
        })();
    </script>
    <style>
        .badge-frozen {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            background: var(--info-bg);
            color: var(--info);
        }
    </style>
</head>

<body class="preload">
<div id="notification"></div>

<aside class="sidebar">
    <div class="sidebar-title">BookStack</div>
    <nav class="nav">
        <a href="admin_usermanagement.html" class="nav-item">User Approval</a>
        <a href="admin_bookmanagement.html" class="nav-item">Product Approval</a>
        <a href="admin_viewusers.html" class="nav-item">Active Users</a>
        <a href="admin_viewbooks.html" class="nav-item active">Active Books</a>
        <a href="admin_logs.html" class="nav-item">Audit Logs</a>
        <a href="homepage.html" class="nav-item">Back to Store</a>
    </nav>
</aside>

<main class="main">
    <div class="header">Active Books</div>

    <!-- Active Books -->
    <div class="card">
        <div class="card-title">Currently Active Books</div>
        <table class="table">
            <thead>
            <tr>
                <th>Book</th>
                <th>Author</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Seller</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody id="activeBooksBody">
            <tr><td colspan="6" class="empty-state">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Frozen Books -->
    <div class="card">
        <div class="card-title">Frozen Books</div>
        <table class="table">
            <thead>
            <tr>
                <th>Book</th>
                <th>Author</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Seller</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody id="frozenBooksBody">
            <tr><td colspan="6" class="empty-state">Loading...</td></tr>
            </tbody>
        </table>
    </div>
</main>

<script>
    const API_BASE   = `${window.location.origin}/api`;
    const ADMIN_BASE = `${window.location.origin}/api/admin`;

    // Auth Check
    fetch(`${API_BASE}/auth/me/`, { credentials: "include" })
        .then(res => { if (!res.ok) { window.location.href = "index.html"; return; } return res.json(); })
        .then(user => { if (!user || !user.roles.includes("ROLE_ADMIN")) window.location.href = "404.html"; })
        .catch(() => { window.location.href = "index.html"; });

    function showNotification(message, type = "info") {
        const note = document.getElementById("notification");
        note.innerText = message;
        note.className = `notification-${type}`;
        note.style.display = "block";
        setTimeout(() => note.style.display = "none", 3000);
    }

    async function fetchBooks() {
        try {
            const [activeRes, frozenRes] = await Promise.all([
                fetch(`${ADMIN_BASE}/books/active/`, { credentials: 'include' }),
                fetch(`${ADMIN_BASE}/books/frozen/`, { credentials: 'include' })
            ]);
            renderActiveBooks(activeRes.ok ? await activeRes.json() : []);
            renderFrozenBooks(frozenRes.ok ? await frozenRes.json() : []);
        } catch (err) {
            showNotification("Failed to load books.", "error");
        }
    }

    function bookRowHTML(book, isFrozen) {
        const coverImg = book.hasCover
            ? `<img src="${window.location.origin}/api/admin/books/${book.bookId}/cover"
                    alt="${book.title}"
                    style="width:40px; height:54px; object-fit:cover; border-radius:4px; border:1px solid var(--border); vertical-align:middle; margin-right:10px;"
                    onerror="this.style.display='none'">`
            : `<span style="font-size:1.6rem; vertical-align:middle; margin-right:10px;">📖</span>`;

        const freezeBtn = isFrozen
            ? `<button class="btn-action approve" onclick="unfreezeBook(${book.bookId}, '${book.title.replace(/'/g, "\\'")}')">Unfreeze</button>`
            : `<button class="btn-action delete-btn" onclick="freezeBook(${book.bookId}, '${book.title.replace(/'/g, "\\'")}')">Freeze</button>`;

        const deleteBtn = `<button class="btn-action delete-btn"
            style="background: var(--error, #dc2626); color: white; margin-left: 6px;"
            onclick="deleteBook(${book.bookId}, '${book.title.replace(/'/g, "\\'")}')">Delete</button>`;

        return `
            <tr>
                <td>
                    <div style="display:flex; align-items:center;">
                        ${coverImg}
                        <div>
                            <div style="font-weight:700;">${book.title}</div>
                            <div class="book-meta">ID: #${book.bookId}</div>
                        </div>
                    </div>
                </td>
                <td>${book.author}</td>
                <td style="font-weight:600; color:var(--price);">$${parseFloat(book.price).toFixed(2)}</td>
                <td>${book.stock ?? 0}</td>
                <td>${book.ownerUsername}</td>
                <td style="white-space: nowrap;">
                    ${freezeBtn}
                    ${deleteBtn}
                </td>
            </tr>`;
    }

    function renderActiveBooks(books) {
        const tbody = document.getElementById('activeBooksBody');
        if (!books || books.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="empty-state">No active books.</td></tr>';
            return;
        }
        tbody.innerHTML = books.map(b => bookRowHTML(b, false)).join('');
    }

    function renderFrozenBooks(books) {
        const tbody = document.getElementById('frozenBooksBody');
        if (!books || books.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="empty-state">No frozen books.</td></tr>';
            return;
        }
        tbody.innerHTML = books.map(b => bookRowHTML(b, true)).join('');
    }

    async function freezeBook(bookId, bookTitle) {
        if (!confirm(`Freeze "${bookTitle}"? It will be hidden from all buyers.`)) return;
        try {
            const res = await fetch(`${ADMIN_BASE}/books/${bookId}/freeze/`, { method: 'PUT', credentials: 'include' });
            if (res.ok) { showNotification(`"${bookTitle}" has been frozen.`, "info"); fetchBooks(); }
            else showNotification("Failed to freeze book.", "error");
        } catch { showNotification("Network error.", "error"); }
    }

    async function unfreezeBook(bookId, bookTitle) {
        try {
            const res = await fetch(`${ADMIN_BASE}/books/${bookId}/unfreeze/`, { method: 'PUT', credentials: 'include' });
            if (res.ok) { showNotification(`"${bookTitle}" has been unfrozen.`, "success"); fetchBooks(); }
            else showNotification("Failed to unfreeze book.", "error");
        } catch { showNotification("Network error.", "error"); }
    }

    async function deleteBook(bookId, bookTitle) {
        if (!confirm(`Permanently delete "${bookTitle}"? This cannot be undone.`)) return;
        try {
            const res = await fetch(`${ADMIN_BASE}/books/${bookId}/reject/`, { method: 'DELETE', credentials: 'include' });
            if (res.ok) { showNotification(`"${bookTitle}" has been deleted.`, "info"); fetchBooks(); }
            else showNotification("Failed to delete user.", "error");
        } catch { showNotification("Network error.", "error"); }
    }

    document.addEventListener('DOMContentLoaded', fetchBooks);

    async function applyTheme() {
        const cached = localStorage.getItem('bookstack-theme');
        if (cached) {
            const isDark = cached === 'dark';
            document.body.classList.toggle("dark", isDark);
            document.documentElement.classList.toggle("dark", isDark);
        }
        const hasCookie = document.cookie.includes('bookstack-jwt');
        if (!hasCookie) { document.body.classList.remove("preload"); return; }
        try {
            const res   = await fetch(`${API_BASE}/me/`, { credentials: 'include' });
            if (!res.ok) { document.body.classList.remove("preload"); return; }
            const user  = await res.json();
            const theme = (user.themePreference || "light").toLowerCase().trim();
            const isDark = theme === "dark";
            localStorage.setItem('bookstack-theme', theme);
            document.body.classList.toggle("dark", isDark);
            document.documentElement.classList.toggle("dark", isDark);
        } catch (err) { console.error("Theme load failed", err); }
        document.body.classList.remove("preload");
    }

    applyTheme();
</script>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
<script src="notifications.js"></script>
<script src="global-init.js"></script>
</body>
</html>
