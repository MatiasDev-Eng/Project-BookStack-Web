<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist | Bookstore</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="navbar">
        <div class="nav-content">
            <div class="logo">BookStore</div>

            <div class="search-container">
                <input type="text" placeholder="Search for books, authors, or ISBN...">
                <button class="search-btn">&#128269;</button>
                <button class="add-new-btn" id="filterBtn">Filter</button>
            </div>

            <div class="nav-icons" style="display: flex; align-items: center; gap: 1rem;">
                <a href="wishlist.html" class="cart-btn" style="font-size: 1.4rem; text-decoration: none;">&#10084;</a>
                <a href="cart.html" class="cart-btn" style="font-size: 1.4rem; text-decoration: none;">&#128722;</a>
                <div class="profile-container">
                    <div class="profile-circle"></div>
                </div>
            </div>
        </div>
    </header>

    <div class="container wide">
        <h1>Your Wishlist</h1>

        <table class="listings-table" style="margin-top: 1.5rem;">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Price</th>
                    <th>Availability</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>The Great Gatsby</td>
                    <td>F. Scott Fitzgerald</td>
                    <td>$12.99</td>
                    <td>In Stock</td>
                    <td>
                        <button class="submit-btn">Move to Cart</button>
                        <button class="cancel-btn" style="margin-left: 8px;">Remove</button>
                    </td>
                </tr>

                <tr>
                    <td>1984</td>
                    <td>George Orwell</td>
                    <td>$10.00</td>
                    <td>In Stock</td>
                    <td>
                        <button class="submit-btn">Move to Cart</button>
                        <button class="cancel-btn" style="margin-left: 8px;">Remove</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        document.getElementById("filterBtn").addEventListener("click", () => {
            console.log("Filter options coming soon!");
        });

        document.addEventListener('DOMContentLoaded', () => {
            const savedPicUrl = localStorage.getItem('bookstack-profile-pic');
            const profileCircle = document.querySelector('.profile-circle');

            if (savedPicUrl && profileCircle) {
                const fullImageUrl = `http://localhost:8080${savedPicUrl}`;
                
                profileCircle.innerHTML = `<img src="${fullImageUrl}" alt="User Profile">`;
            } else if (profileCircle) {
                profileCircle.innerHTML = '👤'; 
            }
        });
    </script>
</body>
</html>
