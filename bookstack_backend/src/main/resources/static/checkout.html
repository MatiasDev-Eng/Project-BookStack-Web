<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Bookstore</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="navbar">
        <div class="nav-content">
            <div class="logo">BookStore</div>

            <div class="search-container">
                <input type="text" placeholder="Search for books, authors, or ISBN...">
                <button class="search-btn">&#128269;</button>
                <button class="add-new-btn" id="filterBtn">Filter</button>
            </div>

            <div class="nav-icons" style="display: flex; align-items: center; gap: 1rem;">
                <a href="wishlist.html" class="cart-btn" style="font-size: 1.4rem; text-decoration: none;">&#10084;</a>
                <a href="cart.html" class="cart-btn" style="font-size: 1.4rem; text-decoration: none;">&#128722;</a>
                <div class="profile-container">
                    <div class="profile-circle"></div>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <h1>Checkout</h1>

        <h2 style="margin-top: 1.5rem;">Order Summary</h2>
        <table class="listings-table">
            <thead>
                <tr>
                    <th>Book</th>
                    <th>Price</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>The Great Gatsby</td>
                    <td>$12.99</td>
                </tr>
                <tr>
                    <td>1984</td>
                    <td>$10.00</td>
                </tr>
            </tbody>
        </table>

        <p style="margin-top: 1rem;"><strong>Subtotal:</strong> $22.99</p>
        <p><strong>Tax (7%):</strong> $1.61</p>
        <p><strong>Total:</strong> $24.60</p>

        <h2 style="margin-top: 2rem;">Payment Information</h2>

        <div class="form-group">
            <label>Card Number</label>
            <input type="text" placeholder="1234 5678 9012 3456">
        </div>

        <div class="form-group">
            <label>Expiration Date</label>
            <input type="text" placeholder="MM/YY">
        </div>

        <div class="form-group">
            <label>CVV</label>
            <input type="text" placeholder="123">
        </div>

        <div class="form-group">
            <label>Name on Card</label>
            <input type="text" placeholder="John Doe">
        </div>

        <button class="submit-btn" style="margin-top: 1rem;">Submit Payment</button>
        <button class="cancel-btn" style="margin-top: 1rem; margin-left: 10px;">Cancel</button>
    </div>

    <script>
        document.getElementById("filterBtn").addEventListener("click", () => {
            console.log("Filter options coming soon!");
        });
    </script>
</body>
</html>
