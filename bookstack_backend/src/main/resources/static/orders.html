<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>My Orders | BookStack</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css">
    <script>
        // Apply theme instantly from cache to prevent white flash
        (function() {
        const cached = localStorage.getItem('bookstack-theme');
        if (cached === 'dark') document.documentElement.classList.add('dark');
        })();
    </script>
</head>
<body class="preload">

<div class="container">
    <a href="homepage.html" class="nav-link">← Back Home</a>
    <div class="title">My Order History</div>
    <div id="ordersList">
        <div class="empty-state">Loading your orders...</div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>

<script src="notifications.js"></script>
<script src="global-init.js"></script>


<script>
    const API_BASE = `${window.location.origin}/api`;

    function getStatusClass(status) {
        if (!status) return 'badge-default';
        switch (status.toUpperCase()) {
            case 'ORDERED': return 'badge-ordered';
            case 'IN_TRANSIT': return 'badge-transit';
            case 'DELIVERED': return 'badge-delivered';
            default: return 'badge-default';
        }
    }

    function formatStatus(status) {
        if (!status) return 'Unknown';
        return status.replace(/_/g, ' ').toLowerCase()
            .replace(/\b\w/g, s => s.toUpperCase());
    }

    async function fetchOrders() {
        const listDiv = document.getElementById('ordersList');

        try {
            const response = await fetch(`${API_BASE}/orders/`, {
                method: 'GET',
                credentials: 'include'
            });

            if (response.status === 401) {
                listDiv.innerHTML = '<p class="empty-state">Session expired. Please <a href="login.html">log in</a>.</p>';
                return;
            }

            if (!response.ok) throw new Error("Failed to load orders");

            const orders = await response.json();

            if (!orders || orders.length === 0) {
                listDiv.innerHTML = '<div class="empty-state">You haven\'t placed any orders yet.</div>';
                return;
            }

            orders.sort((a, b) => b.id - a.id);

            listDiv.innerHTML = orders.map(order => {
                const date = new Date(order.orderDate).toLocaleDateString('en-US', {
                    year: 'numeric', month: 'short', day: 'numeric'
                });

                const statusClass = getStatusClass(order.status);
                const displayStatus = formatStatus(order.status);

                const address = order.deliveryAddress || 'No address provided';
                const cardInfo = order.cardNumber ? `${order.cardNumber} (${order.cardHolderName})` : 'Payment info unavailable';

                return `
                  <a href="order-details.html?id=${order.id}" class="order-link">
                    <div class="order-card">
                      <div class="card-header">
                        <div class="order-info">
                          <h3>Order #${order.id} <span class="badge ${statusClass}">${displayStatus}</span></h3>
                          <p>Placed on ${date} • ${order.itemCount} Items</p>
                        </div>
                        <div class="order-total">$${Number(order.totalPrice).toFixed(2)}</div>
                      </div>

                      <div class="order-details-summary">
                        <div class="detail-item">
                            <strong>Shipping To</strong>
                            <span>${address}</span>
                        </div>
                        <div class="detail-item">
                            <strong>Payment Method</strong>
                            <span>💳 ${cardInfo}</span>
                        </div>
                      </div>
                    </div>
                  </a>
                `;
            }).join('');

        } catch (err) {
            listDiv.innerHTML = `<p class="empty-state" style="color: #ef4444;">${err.message}</p>`;
            console.error("Fetch error:", err);
        }
    }

    document.addEventListener('DOMContentLoaded', fetchOrders);

    async function applyTheme() {
        try {
            const res = await fetch(`${API_BASE}/me/`, { credentials: 'include' });
            if (!res.ok) return;

            const user = await res.json();
            const theme = user.themePreference || "light";
            localStorage.setItem('bookstack-theme', theme);

            document.body.classList.toggle("dark", theme === "dark");
        } catch (err) {
            console.error("Theme load failed", err);
        }
        document.body.classList.remove("preload");
    }

    applyTheme();

</script>
</body>
</html>
