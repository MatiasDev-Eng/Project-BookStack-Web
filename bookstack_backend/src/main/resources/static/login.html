<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Bookstack Login</title>
    <link rel="stylesheet" href="style.css">
    <script>
        // Apply theme instantly from cache to prevent white flash
        (function() {
        const cached = localStorage.getItem('bookstack-theme');
        if (cached === 'dark') document.documentElement.classList.add('dark');
        })();
    </script>
</head>
<body class="preload">

<div class="login-card">
    <h2>Bookstack Sign In</h2>
    <form id="loginForm">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter username" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter password" required>
        </div>
        <button type="submit" id="submitBtn">Sign In</button>
    </form>

    <div id="message"></div>

    <div class="login-link">
        Don't have an account? <a href="index.html">Sign Up</a>
    </div>
</div>

<script>
    const API_BASE = `${window.location.origin}/api`;
    const loginForm = document.getElementById('loginForm');
    const messageDiv = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        // Reset UI
        messageDiv.className = "";
        messageDiv.textContent = "Processing...";
        submitBtn.disabled = true;

        const payload = {
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
        };

        try {
            const response = await fetch(`${API_BASE}/auth/signin/`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'include',
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                const userData = await response.json();
                localStorage.setItem('bookstack-user-id', userData.userId);
                localStorage.setItem('bookstack-theme', userData.themePreference || 'light');
                messageDiv.textContent = "Login Successful! Welcome back.";
                messageDiv.className = "success";
                setTimeout(() => {
                    window.location.href = 'homepage.html';
                }, 1000);
                loginForm.reset();
            } else if (response.status === 403) {
                messageDiv.textContent = "Your account is pending admin approval.";
                messageDiv.className = "error";
            } else {
                const errorData = await response.text();
                messageDiv.textContent = "Login Failed: " + (errorData || "Invalid credentials");
                messageDiv.className = "error";
            }
        } catch (error) {
            messageDiv.textContent = "Server Error: Could not connect to backend.";
            messageDiv.className = "error";
        } finally {
            submitBtn.disabled = false;
        }
    });
    async function applyTheme() {
        // Apply cached theme instantly
        const cached = localStorage.getItem('bookstack-theme');
        if (cached) {
            const isDark = cached === 'dark';
            document.body.classList.toggle("dark", isDark);
            document.documentElement.classList.toggle("dark", isDark);
        }

        // Then verify from server if cookie present
        const hasCookie = document.cookie.includes('bookstack-jwt');
        if (!hasCookie) {
            document.body.classList.remove("preload");
            return;
        }
        try {
            const res = await fetch(`${API_BASE}/me/`, { credentials: 'include' });
            if (!res.ok) { document.body.classList.remove("preload"); return; }
            const user   = await res.json();
            const theme  = (user.themePreference || "light").toLowerCase().trim();
            const isDark = theme === "dark";
            localStorage.setItem('bookstack-theme', theme);
            document.body.classList.toggle("dark", isDark);
            document.documentElement.classList.toggle("dark", isDark);
        } catch (err) {
            console.error("Theme load failed", err);
        }
        document.body.classList.remove("preload");
    }

    applyTheme();
</script>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
<script src="notifications.js"></script>
<script src="global-init.js"></script>
</body>
</html>
