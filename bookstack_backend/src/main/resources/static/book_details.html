<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Details | Bookstore</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .book-cover-img {
            width: 100%;
            max-width: 280px;
            height: 360px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            display: block;
            margin-bottom: 1.5rem;
        }

        .book-cover-placeholder {
            width: 280px;
            height: 360px;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            margin-bottom: 1.5rem;
        }

        .book-layout {
            display: flex;
            gap: 2rem;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        .book-details { flex: 1; min-width: 260px; }
    </style>
</head>

<body>
<header class="navbar">
    <div class="nav-content">
        <div class="logo" onclick="window.location.href='homepage.html'" style="cursor:pointer">BookStore</div>
        <div class="search-container">
            <input type="text" placeholder="Search for books, authors, or ISBN...">
            <button class="search-btn">&#128269;</button>
            <button class="add-new-btn" id="filterBtn">Filter</button>
        </div>
        <div class="nav-icons" style="display: flex; align-items: center; gap: 1rem;">
            <a href="wishlist.html" class="cart-btn" style="font-size: 1.4rem; text-decoration: none;">&#10084;</a>
            <a href="cart.html" class="cart-btn" style="font-size: 1.4rem; text-decoration: none;">&#128722;</a>
            <div class="profile-container">
                <div class="profile-circle"></div>
            </div>
        </div>
    </div>
</header>

<div class="container">
    <div class="book-layout">
        <!-- Cover image or placeholder -->
        <div id="coverContainer">
            <div class="book-cover-placeholder">📖</div>
        </div>

        <div class="book-details">
            <h1 id="book-title">Loading...</h1>

            <div class="form-group">
                <label><strong>Author:</strong></label>
                <p id="book-author">Loading...</p>
            </div>

            <div class="form-group">
                <label><strong>Condition:</strong></label>
                <p id="book-condition">Loading...</p>
            </div>

            <div class="form-group">
                <label><strong>Price:</strong></label>
                <p id="book-price">Loading...</p>
            </div>

            <div class="form-group">
                <label><strong>Seller Rating:</strong></label>
                <p id="seller-rating">★★★★☆</p>
            </div>

            <button class="submit-btn" style="margin-top: 1rem;">Add to Cart</button>
            <button class="add-new-btn" style="margin-top: 1rem; margin-left: 10px;">Add to Wishlist</button>
        </div>
    </div>

    <h2 style="margin-top: 2rem;">Description</h2>
    <p id="book-description">Loading...</p>

    <h2 style="margin-top: 2rem;">More Like This</h2>
    <div id="similar-books" class="similar-books-container"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
<script src="notifications.js"></script>
<script src="global-init.js"></script>

<script>
    const API_BASE = `${window.location.origin}/api`;

    document.getElementById("filterBtn").addEventListener("click", () => {
        console.log("Filter options coming soon");
    });

    const params = new URLSearchParams(window.location.search);
    const bookId = params.get("id");

    async function loadBook() {
        const res = await fetch(`${API_BASE}/books/${bookId}`, { credentials: 'include' });
        const data = await res.json();

        document.getElementById("book-title").textContent     = data.title;
        document.getElementById("book-author").textContent    = data.author;
        document.getElementById("book-condition").textContent = data.condition || "N/A";
        document.getElementById("book-price").textContent     = "$" + data.price;
        document.getElementById("book-description").textContent = data.description || "No description available";

        // Swap placeholder for real cover if one exists
        const coverContainer = document.getElementById("coverContainer");
        if (data.hasCover) {
            const img = document.createElement("img");
            img.src       = `${API_BASE}/books/${bookId}/cover`;
            img.alt       = data.title;
            img.className = "book-cover-img";
            img.onerror   = () => {
                coverContainer.innerHTML = '<div class="book-cover-placeholder">📖</div>';
            };
            coverContainer.innerHTML = "";
            coverContainer.appendChild(img);
        }
    }

    async function loadSimilarBooks() {
        const res = await fetch(`${API_BASE}/books/${bookId}/similar`, { credentials: 'include' });
        const similarBooks = await res.json();

        const container = document.getElementById("similar-books");
        container.innerHTML = "";

        similarBooks.forEach(book => {
            const card = document.createElement("div");
            card.classList.add("similar-book-card");
            card.innerHTML = `
                    <p><strong>${book.title}</strong></p>
                    <p>${book.author}</p>
                    <p>$${book.price}</p>
                `;
            card.onclick = () => {
                window.location.href = `book_details.html?id=${book.bookId}`;
            };
            container.appendChild(card);
        });
    }

    loadBook();
    loadSimilarBooks();
</script>
</body>
</html>
