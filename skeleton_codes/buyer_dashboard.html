<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buyer Dashboard | Bookstore</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="navbar">
        <div class="nav-content">
            <div class="logo">BookStore</div>

            <div class="search-container">
                <input type="text" placeholder="Search for books, authors, or ISBN...">
                <button class="search-btn">&#128269;</button>
                <button class="add-new-btn" id="filterBtn">Filter</button>
            </div>

            <div class="nav-icons" style="display: flex; align-items: center; gap: 1rem;">
                <a href="wishlist.html" class="cart-btn" style="font-size: 1.4rem; text-decoration: none;">&#10084;</a>
                <a href="cart.html" class="cart-btn" style="font-size: 1.4rem; text-decoration: none;">&#128722;</a>
                <div class="profile-container">
                    <div class="profile-circle"></div>
                </div>
            </div>
        </div>
    </header>

    <div class="container wide">

        <div class="dashboard-header">
            <h1>Welcome Back</h1>
        </div>

        <section class="dashboard-section">
            <h2>Recommended for You</h2>
            <table class="listings-table">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Condition</th>
                        <th>Price</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>The Great Gatsby</td>
                        <td>F. Scott Fitzgerald</td>
                        <td>LIKE_NEW</td>
                        <td>$12.99</td>
                    </tr>
                    <tr>
                        <td>1984</td>
                        <td>George Orwell</td>
                        <td>VERY_GOOD</td>
                        <td>$10.00</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <section class="dashboard-section" style="margin-top: 2rem;">
            <h2>Your Recent Orders</h2>
            <table class="listings-table">
                <thead>
                    <tr>
                        <th>Book</th>
                        <th>Status</th>
                        <th>Order #</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>The Hobbit</td>
                        <td><span class="status visible">Delivered</span></td>
                        <td>#12345</td>
                    </tr>
                    <tr>
                        <td>Brave New World</td>
                        <td><span class="status pending">In Transit</span></td>
                        <td>#12346</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </div>

    <script>
        document.getElementById("filterBtn").addEventListener("click", () => {
            alert("Filter options coming soon");
        });
    </script>
</body>
