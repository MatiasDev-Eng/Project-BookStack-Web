<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Listings | Bookstore</title>
    <link rel="stylesheet" href="style.css">
    <script>
        // Apply theme instantly from cache to prevent white flash
        (function() {
        const cached = localStorage.getItem('bookstack-theme');
        if (cached === 'dark') document.documentElement.classList.add('dark');
        })();
    </script>
</head>
<body class="preload">
<div id="notification"></div>
<header class="navbar">
    <div class="nav-content">
        <div class="logo" onclick="window.location.href='homepage.html'" style="cursor:pointer">BookStore</div>
        <div class="search-container">
            <input type="text" placeholder="Search for books, authors, or ISBN...">
            <button class="search-btn">&#128269;</button>
        </div>
        <div class="profile-container">
            <div class="profile-circle"></div>
        </div>
    </div>
</header>

<div class="container wide">
    <div class="dashboard-header">
        <h1>Your Active Listings</h1>
        <button class="add-new-btn" onclick="window.location.href='/list-book.html'">+ List New Book</button>
    </div>

    <table class="listings-table">
        <thead>
        <tr>
            <th>Title</th>
            <th>Author</th>
            <th>Year</th>
            <th>ISBN</th>
            <th>Price</th>
            <th>Condition</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="listings-tbody">
        <tr>
            <td colspan="8" style="text-align: center; padding: 20px;">Loading your books...</td>
        </tr>
        </tbody>
    </table>
</div>

<script>
  // Notification function
  function showNotification(message, type = "info") {
    const note = document.getElementById("notification");
    note.innerText = message;
    note.className = `notification-${type}`;
    note.style.display = "block";
    setTimeout(() => {
      note.style.display = "none";
    }, 3000);
  }
    const API_BASE = `${window.location.origin}/api`;
    const API_URL = `${API_BASE}/books/me/`;
    const token = localStorage.getItem('token');

    async function fetchListings() {
        const tbody = document.getElementById('listings-tbody');

        try {
            const response = await fetch(API_URL, {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            });

            if (!response.ok) throw new Error("Could not fetch listings");

            const books = await response.json();

            if (books.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align: center;">No books found.</td></tr>';
                return;
            }

            tbody.innerHTML = books.map(book => `
                    <tr>
                        <td>${book.title}</td>
                        <td>${book.author || 'N/A'}</td>
                        <td>${book.year || 'N/A'}</td>
                        <td>${book.isbn || 'N/A'}</td>
                        <td>$${book.price ? book.price.toFixed(2) : '0.00'}</td>
                        <td>${book.condition || 'N/A'}</td>
                        <td>
                            <span class="status ${book.approved ? 'visible' : 'pending'}">
                                ${book.approved ? 'Visible' : 'Pending Approval'}
                            </span>
                        </td>
                        <td class="action-buttons">
                            <button class="edit-btn" onclick="editListing(${book.id})">Edit</button>
                            <button class="delete-btn" onclick="deleteListing(${book.id})">Delete</button>
                        </td>
                    </tr>
                `).join('');

        } catch (error) {
            console.error("Error:", error);
            tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: red;">Failed to load data. Ensure you are logged in.</td></tr>';
        }
    }

    async function deleteListing(id) {
        const btn = event.target;
        if (btn.innerText === "Delete") {
            btn.innerText = "Sure?";
            btn.style.backgroundColor = "#ef4444";
            btn.style.color = "white";
            setTimeout(() => {
                btn.innerText = "Delete";
                btn.style.backgroundColor = "";
                btn.style.color = "";
            }, 3000);
            return;
        }

        try {
            const response = await fetch(`${API_URL}${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (response.ok) {
                fetchListings(); // Refresh the list
            } else {
                showNotification("Delete failed.", "error");
            }
        } catch (err) {
            console.error(err);
        }
    }

    function editListing(id) {
        // Logic to redirect to your edit form with the book ID
        window.location.href = `edit-book.html?id=${id}`;
    }

    // Initialize table on load
    document.addEventListener('DOMContentLoaded', fetchListings);

    async function applyTheme() {
        try {
            const res = await fetch(`${API_BASE}/me/`, { credentials: 'include' });
            if (!res.ok) return;

            const user = await res.json();
            const theme = user.themePreference || "light";
            localStorage.setItem('bookstack-theme', theme);

            document.body.classList.toggle("dark", theme === "dark");
        } catch (err) {
            console.error("Theme load failed", err);
        }
        document.body.classList.remove("preload");
    }

    applyTheme();

</script>
</body>
</html>
