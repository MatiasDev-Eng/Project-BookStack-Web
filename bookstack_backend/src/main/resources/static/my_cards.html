<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Methods | Bookstore</title>
    <link rel="stylesheet" href="style.css">
    <script>
        // Apply theme instantly from cache to prevent white flash
        (function() {
        const cached = localStorage.getItem('bookstack-theme');
        if (cached === 'dark') document.documentElement.classList.add('dark');
        })();
    </script>
    <style>
    /* Nav avatar photo support */
    .user-profile-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: none;
    }
    .user-profile-btn.has-photo img        { display: block; }
    .user-profile-btn.has-photo .nav-emoji { display: none; }
  </style>
</head>
<body class="preload">
<div id="notification"></div>

<nav>
  <div class="nav-left">
    <a href="homepage.html" class="logo">BookStack</a>
  </div>
 
  <div class="nav-right" style="margin-left: auto;">
    <a href="admin_usermanagement.html" id="adminBtn" class="publish-btn admin-btn" style="display: none;">
      🛡️ Admin
    </a>
    <a href="publish_book.html" class="publish-btn"><span>+</span> Publish Book</a>
    <div class="nav-icon-btn" onclick="window.location.href='wishlist.html'">❤️</div>
    <div class="nav-icon-btn" onclick="window.location.href='cart.html'">🛒</div>
    <div class="user-profile-btn" onclick="window.location.href='account.html'">
      <img id="navAvatar" alt="Profile">
      <span class="nav-emoji">👤</span>
    </div>
  </div>
</nav>

<div class="container wide">
    <div class="dashboard-header">
        <h1>Your Payment Methods</h1>
        <button class="add-new-btn" onclick="openModal()">+ Add New Card</button>
    </div>
    <div id="card-container" class="card-grid">
        <p style="padding: 20px; color: #666;">Loading your cards...</p>
    </div>
</div>

<div id="cardModal" class="modal">
    <div class="modal-content">
        <h2>Link New Credit Card</h2>
        <div class="form-group">
            <label>Cardholder Name</label>
            <input type="text" id="cardHolderName">
        </div>
        <div class="form-group">
            <label>Card Number</label>
            <input type="text" id="cardNumber" maxlength="19">
        </div>
        <div style="display: flex; gap: 15px;">
            <div class="form-group"><label>Expiration Date</label><input type="date" id="expirationDate"></div>
            <div class="form-group"><label>CVV</label><input type="number" id="cvv"></div>
        </div>
        <div class="form-group"><label>Zip Code</label><input type="text" id="zipCode"></div>
        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button class="submit-btn" onclick="saveCard()">Save Card</button>
            <button class="cancel-btn" onclick="closeModal()">Cancel</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>

<script src="notifications.js"></script>
<script src="global-init.js"></script>

<script>
    const API_BASE = `${window.location.origin}/api`;

    // Exact same helper from your Publish file
    function getSavedUserId() {
        return localStorage.getItem('bookstack-user-id');
    }

        async function checkAdminStatus() {
        try {
        const res = await fetch(`${API_BASE}/auth/me/`, { credentials: 'include' });
        if (res.ok) {
            const user = await res.json();
            if (user.roles && user.roles.includes('ROLE_ADMIN')) {
            document.getElementById('adminBtn').style.display = 'flex';
            }
            try {
            const picRes = await fetch(`${API_BASE}/me/profile-picture`, { credentials: 'include' });
            if (picRes.ok) {
                const blob       = URL.createObjectURL(await picRes.blob());
                const navAvatar  = document.getElementById('navAvatar');
                const profileBtn = document.querySelector('.user-profile-btn');
                navAvatar.src    = blob;
                navAvatar.onload = () => profileBtn.classList.add('has-photo');
            }
            } catch (e) { /* no picture */ }
        }
        } catch (e) {
        console.warn("Admin check failed:", e);
        }
    }

    function showNotification(message, type = 'info') {
        const note = document.getElementById('notification');
        note.innerText = message;
        note.className = `notification-${type}`;
        note.style.display = 'block';
        setTimeout(() => { note.style.display = 'none'; }, 3000);
    }

    // Format card number blocks
    document.getElementById('cardNumber').addEventListener('input', function(e) {
        let value = e.target.value.replace(/\D/g, '');
        e.target.value = value.match(/.{1,4}/g)?.join(' ') || '';
    });

    document.addEventListener('DOMContentLoaded', () => {
        checkAdminStatus();
        fetchCards();
    });

    async function fetchCards() {
        const container = document.getElementById('card-container');
        const token = localStorage.getItem('token');

        try {
            const response = await fetch(`${API_BASE}/payments/cards/`, {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            });

            if (response.ok) {
                const cards = await response.json();
                if (cards.length === 0) {
                    container.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">No cards found.</p>';
                    return;
                }
                container.innerHTML = cards.map(card => `
                    <div class="credit-card-item">
                        <div class="card-number-display">${card.cardNumber}</div>
                        <div>
                            <div class="card-label">Card Holder</div>
                            <div style="font-weight: bold;">${card.cardHolderName}</div>
                        </div>
                    </div>
                `).join('');
            }
        } catch (error) {
            console.error(error);
        }
    }

    async function saveCard() {
        const currentUserId = getSavedUserId();
        const token = localStorage.getItem('token');

        if (!currentUserId) {
            showNotification("Session expired. Please log in again.", "error");
            return;
        }

        const cardData = {
            userId: Number(currentUserId),
            cardNumber: document.getElementById('cardNumber').value.replace(/\s+/g, ''),
            cardHolderName: document.getElementById('cardHolderName').value,
            expirationDate: document.getElementById('expirationDate').value + "T00:00:00",
            cvv: parseInt(document.getElementById('cvv').value),
            zipCode: document.getElementById('zipCode').value
        };

        try {
            const response = await fetch(`${API_BASE}/payments/add-card/`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(cardData)
            });

            if (response.ok) {
                showNotification('Card added!', 'success');
                closeModal();
                fetchCards();
            }
        } catch (error) {
            console.error(error);
        }
    }

    function openModal() { document.getElementById('cardModal').style.display = 'block'; }
    function closeModal() { document.getElementById('cardModal').style.display = 'none'; }

    async function applyTheme() {
        // Don't attempt if no JWT cookie present
        const hasCookie = document.cookie.includes('bookstack-jwt');
        if (!hasCookie) {
            document.body.classList.remove("preload");
            return;
        }

        try {
            const res = await fetch(`${API_BASE}/me/`, { credentials: 'include' });
            if (!res.ok) {
                document.body.classList.remove("preload");
                return;
            }
            const user = await res.json();
            const theme = user.themePreference || "light";
            localStorage.setItem('bookstack-theme', theme);
            document.body.classList.toggle("dark", theme === "dark");
        } catch (err) {
            console.error("Theme load failed", err);
        }
        document.body.classList.remove("preload");
    }

    applyTheme();

</script>
</body>
</html>
