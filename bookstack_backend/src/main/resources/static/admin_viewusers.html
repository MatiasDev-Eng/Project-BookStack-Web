<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Users | Admin</title>
    <link rel="stylesheet" href="style.css">
    <script>
        (function() {
            const cached = localStorage.getItem('bookstack-theme');
            if (cached === 'dark') document.documentElement.classList.add('dark');
        })();
    </script>
    <style>
        .section-title {
            font-family: var(--font-display);
            font-size: 1rem;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin: 28px 0 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }
        .badge-frozen {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            background: var(--info-bg);
            color: var(--info);
        }
    </style>
</head>

<body class="preload">
<div id="notification"></div>

<aside class="sidebar">
    <div class="sidebar-title">BookStack</div>
    <nav class="nav">
        <a href="admin_usermanagement.html" class="nav-item">User Approval</a>
        <a href="admin_bookmanagement.html" class="nav-item">Product Approval</a>
        <a href="admin_viewusers.html" class="nav-item active">Active Users</a>
        <a href="admin_viewbooks.html" class="nav-item">Active Books</a>
        <a href="admin_logs.html" class="nav-item">Audit Logs</a>
        <a href="homepage.html" class="nav-item">Back to Store</a>
    </nav>
</aside>

<main class="main">
    <div class="header">Active Users</div>

    <!-- Active Users -->
    <div class="card">
        <div class="card-title">Currently Active Users</div>
        <table class="table">
            <thead>
            <tr>
                <th>User</th>
                <th>Email</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody id="activeUsersBody">
            <tr><td colspan="4" class="empty-state">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Frozen Users -->
    <div class="card">
        <div class="card-title">Frozen Users</div>
        <table class="table">
            <thead>
            <tr>
                <th>User</th>
                <th>Email</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody id="frozenUsersBody">
            <tr><td colspan="4" class="empty-state">Loading...</td></tr>
            </tbody>
        </table>
    </div>
</main>

<script>
    fetch("http://localhost:9091/api/auth/me/", { credentials: "include" })
        .then(res => { if (!res.ok) { window.location.href = "index.html"; return; } return res.json(); })
        .then(user => { if (!user || !user.roles.includes("ROLE_ADMIN")) window.location.href = "404.html"; })
        .catch(() => { window.location.href = "index.html"; });

    const API_BASE = "http://localhost:9091/api/admin";

    function showNotification(message, type = "info") {
        const note = document.getElementById("notification");
        note.innerText = message;
        note.className = `notification-${type}`;
        note.style.display = "block";
        setTimeout(() => note.style.display = "none", 3000);
    }

    async function fetchUsers() {
        try {
            const [activeRes, frozenRes] = await Promise.all([
                fetch(`${API_BASE}/users/active/`, { credentials: 'include' }),
                fetch(`${API_BASE}/users/frozen/`, { credentials: 'include' })
            ]);
            renderActiveUsers(activeRes.ok ? await activeRes.json() : []);
            renderFrozenUsers(frozenRes.ok ? await frozenRes.json() : []);
        } catch (err) {
            showNotification("Failed to load users.", "error");
        }
    }

    function userRowHTML(user, isFrozen) {
        const profilePic = `
            <div style="width:36px; height:36px; border-radius:50%; overflow:hidden; border:1px solid var(--border); flex-shrink:0; background:var(--bg-subtle); display:flex; align-items:center; justify-content:center; font-size:1.1rem;">
                <img src="${window.location.origin}/api/admin/users/${user.userId}/profile-picture"
                     alt="${user.username}"
                     style="width:100%; height:100%; object-fit:cover;"
                     onerror="this.parentElement.innerHTML='👤'">
            </div>`;

        const statusBadge = isFrozen
            ? `<span class="badge-frozen">❄️ Frozen</span>`
            : `<span class="status visible">Active</span>`;

        const freezeBtn = isFrozen
            ? `<button class="btn-action approve" onclick="unfreezeUser(${user.userId}, '${user.username}')">Unfreeze</button>`
            : `<button class="btn-action delete-btn" onclick="freezeUser(${user.userId}, '${user.username}')">Freeze</button>`;

        const deleteBtn = `<button class="btn-action delete-btn"
            style="background: var(--error, #dc2626); color: white; margin-left: 6px;"
            onclick="deleteUser(${user.userId}, '${user.username}')">Delete</button>`;

        return `
            <tr>
                <td>
                    <div style="display:flex; align-items:center; gap:10px;">
                        ${profilePic}
                        <strong>${user.username}</strong>
                    </div>
                </td>
                <td>${user.email}</td>
                <td>${statusBadge}</td>
                <td style="white-space: nowrap;">
                    ${freezeBtn}
                    ${deleteBtn}
                </td>
            </tr>`;
    }

    function renderActiveUsers(users) {
        const tbody = document.getElementById('activeUsersBody');
        if (!users || users.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="empty-state">No active users.</td></tr>';
            return;
        }
        tbody.innerHTML = users.map(u => userRowHTML(u, false)).join('');
    }

    function renderFrozenUsers(users) {
        const tbody = document.getElementById('frozenUsersBody');
        if (!users || users.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="empty-state">No frozen users.</td></tr>';
            return;
        }
        tbody.innerHTML = users.map(u => userRowHTML(u, true)).join('');
    }

    async function freezeUser(userId, username) {
        if (!confirm(`Freeze "${username}"? They will not be able to log in.`)) return;
        try {
            const res = await fetch(`${API_BASE}/users/${userId}/freeze/`, { method: 'PUT', credentials: 'include' });
            if (res.ok) { showNotification(`"${username}" has been frozen.`, "info"); fetchUsers(); }
            else showNotification("Failed to freeze user.", "error");
        } catch { showNotification("Network error.", "error"); }
    }

    async function unfreezeUser(userId, username) {
        try {
            const res = await fetch(`${API_BASE}/users/${userId}/unfreeze/`, { method: 'PUT', credentials: 'include' });
            if (res.ok) { showNotification(`"${username}" has been unfrozen.`, "success"); fetchUsers(); }
            else showNotification("Failed to unfreeze user.", "error");
        } catch { showNotification("Network error.", "error"); }
    }

    async function deleteUser(userId, username) {
        if (!confirm(`Permanently delete "${username}"? This cannot be undone.`)) return;
        try {
            const res = await fetch(`${API_BASE}/users/${userId}/reject/`, { method: 'DELETE', credentials: 'include' });
            if (res.ok) { showNotification(`"${username}" has been deleted.`, "info"); fetchUsers(); }
            else showNotification("Failed to delete user.", "error");
        } catch { showNotification("Network error.", "error"); }
    }

    document.addEventListener('DOMContentLoaded', fetchUsers);

    async function applyTheme() {
        const cached = localStorage.getItem('bookstack-theme');
        if (cached) {
            const isDark = cached === 'dark';
            document.body.classList.toggle("dark", isDark);
            document.documentElement.classList.toggle("dark", isDark);
        }
        const hasCookie = document.cookie.includes('bookstack-jwt');
        if (!hasCookie) { document.body.classList.remove("preload"); return; }
        try {
            const res   = await fetch("http://localhost:9091/api/me/", { credentials: 'include' });
            if (!res.ok) { document.body.classList.remove("preload"); return; }
            const user  = await res.json();
            const theme = (user.themePreference || "light").toLowerCase().trim();
            const isDark = theme === "dark";
            localStorage.setItem('bookstack-theme', theme);
            document.body.classList.toggle("dark", isDark);
            document.documentElement.classList.toggle("dark", isDark);
        } catch (err) { console.error("Theme load failed", err); }
        document.body.classList.remove("preload");
    }

    applyTheme();
</script>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
<script src="notifications.js"></script>
<script src="global-init.js"></script>
</body>
</html>
