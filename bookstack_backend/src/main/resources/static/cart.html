<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Your Cart | BookStack</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css">
  <script>
    (function() {
      const cached = localStorage.getItem('bookstack-theme');
      if (cached === 'dark') document.documentElement.classList.add('dark');
    })();
  </script>
</head>

<body class="preload">
<div id="notification"></div>

<div class="cart-container">
  <a href="homepage.html" class="nav-link">← Continue Shopping</a>
  <div class="cart-title">Your Shopping Cart</div>

  <table>
    <thead>
    <tr>
      <th>Book</th>
      <th>Price</th>
      <th>Qty</th>
      <th>Total</th>
      <th>Action</th>
    </tr>
    </thead>
    <tbody id="cartTableBody">
    </tbody>
  </table>

  <div class="cart-summary">
    <div><strong>Grand Total:</strong> <span id="totalAmount">$0.00</span></div>
    <button id="checkoutBtn" class="checkout-btn" onclick="showCheckoutSection()">Proceed to Checkout</button>
  </div>

  <div id="addressSection" class="address-section">
    <h3>Checkout Details</h3>

    <label class="form-label">Delivery Address</label>
    <textarea id="deliveryAddress" class="address-input" rows="2" placeholder="123 Street Name, City, Zip Code"></textarea>

    <label class="form-label">Select Payment Method</label>
    <select id="cardSelect" class="card-select">
      <option value="">Loading saved cards...</option>
    </select>
    <p style="font-size: 0.8rem; color: var(--muted); margin-top: -10px;">
      <a href="my_cards.html">+ Add a new card in Account Settings</a>
    </p>

    <div class="address-actions">
      <button class="cancel-btn" onclick="hideCheckoutSection()">Cancel</button>
      <button id="confirmOrderBtn" class="confirm-btn" onclick="handleCheckout()">Confirm Order</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
<script src="notifications.js"></script>
<script src="global-init.js"></script>

<script>
  const API_BASE = `${window.location.origin}/api`;

  function showNotification(message, type = "info") {
    const note = document.getElementById("notification");
    note.innerText = message;
    note.className = `notification-${type}`;
    note.style.display = "block";
    setTimeout(() => { note.style.display = "none"; }, 3000);
  }

  async function fetchCart() {
    try {
      const response = await fetch(`${API_BASE}/cart/`, { credentials: 'include' });
      if (!response.ok) throw new Error("Unauthorized");
      const items = await response.json();
      renderCart(items);
    } catch (err) {
      showNotification("Failed to load cart", "error");
    }
  }

  function renderCart(items) {
    const tbody = document.getElementById('cartTableBody');
    const totalSpan = document.getElementById('totalAmount');
    const checkoutBtn = document.getElementById('checkoutBtn');

    tbody.innerHTML = '';
    let grandTotal = 0;

    if (!items || items.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Your cart is empty.</td></tr>';
      checkoutBtn.disabled = true;
    } else {
      checkoutBtn.disabled = false;
      items.forEach(item => {
        const itemTotal = item.price * item.quantity;
        grandTotal += itemTotal;
        tbody.innerHTML += `
          <tr>
            <td><strong>${item.title}</strong></td>
            <td>$${item.price.toFixed(2)}</td>
            <td>
              <input type="number" class="qty-input" value="${item.quantity}"
                     onchange="updateQty(${item.cartItemId}, this.value)" min="1">
            </td>
            <td>$${itemTotal.toFixed(2)}</td>
            <td>
              <button class="remove-btn" id="remove-btn-${item.cartItemId}" onclick="showInlineConfirm(${item.cartItemId})">Remove</button>
              <span id="confirm-span-${item.cartItemId}" class="inline-confirm">
                Sure? <button onclick="removeItem(${item.cartItemId})">Yes</button>
                <button onclick="hideInlineConfirm(${item.cartItemId})">No</button>
              </span>
            </td>
          </tr>
        `;
      });
    }
    totalSpan.innerText = `$${grandTotal.toFixed(2)}`;
  }

  async function fetchSavedCards() {
    const cardSelect = document.getElementById('cardSelect');
    const token = localStorage.getItem('token');

    try {
      const response = await fetch(`${API_BASE}/payments/cards/`, {
        method: 'GET',
        headers: { 'Authorization': `Bearer ${token}` }
      });

      if (response.ok) {
        const cards = await response.json();
        if (cards.length === 0) {
          cardSelect.innerHTML = '<option value="">No saved cards found</option>';
        } else {
          cardSelect.innerHTML = '<option value="">-- Choose a Card --</option>' +
            cards.map(card => `<option value="${card.cardId}">${card.cardNumber} (${card.cardHolderName})</option>`).join('');
        }
      } else {
        cardSelect.innerHTML = '<option value="">Error loading cards</option>';
      }
    } catch (err) {
      cardSelect.innerHTML = '<option value="">Connection error</option>';
    }
  }

  function showCheckoutSection() {
    document.getElementById('addressSection').style.display = 'block';
    document.getElementById('checkoutBtn').style.display = 'none';
    fetchSavedCards();
    document.getElementById('addressSection').scrollIntoView({ behavior: 'smooth' });
  }

  function hideCheckoutSection() {
    document.getElementById('addressSection').style.display = 'none';
    document.getElementById('checkoutBtn').style.display = 'block';
  }

  async function handleCheckout() {
    const deliveryAddress = document.getElementById('deliveryAddress').value.trim();
    const selectedCard = document.getElementById('cardSelect').value;

    if (!deliveryAddress) {
      showNotification("Please enter a delivery address.", "error");
      return;
    }
    if (!selectedCard) {
      showNotification("Please select a payment method.", "error");
      return;
    }

    const btn = document.getElementById('confirmOrderBtn');
    btn.disabled = true;
    btn.innerText = "Processing...";

    const payload = {
      deliveryAddress: deliveryAddress,
      cardId: parseInt(selectedCard)
    };

    try {
      const response = await fetch(`${API_BASE}/orders/`, {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (response.ok) {
        showNotification("Order placed successfully!", "success");
        setTimeout(() => { window.location.href = 'orders.html'; }, 1500);
      } else {
        const errorMsg = await response.text();
        showNotification("Checkout failed: " + errorMsg, "error");
        btn.disabled = false;
        btn.innerText = "Confirm Order";
      }
    } catch (err) {
      btn.disabled = false;
      btn.innerText = "Confirm Order";
      showNotification("A connection error occurred.", "error");
    }
  }

  function showInlineConfirm(itemId) {
    document.getElementById(`remove-btn-${itemId}`).style.display = 'none';
    document.getElementById(`confirm-span-${itemId}`).style.display = 'inline';
  }

  function hideInlineConfirm(itemId) {
    document.getElementById(`remove-btn-${itemId}`).style.display = 'inline';
    document.getElementById(`confirm-span-${itemId}`).style.display = 'none';
  }

  async function updateQty(itemId, newQty) {
    if (newQty < 1) return;
    await fetch(`${API_BASE}/cart/update-quantity/${itemId}/?quantity=${newQty}`, { method: 'PUT', credentials: 'include' });
    fetchCart();
  }

  async function removeItem(itemId) {
    await fetch(`${API_BASE}/cart/remove/${itemId}/`, { method: 'DELETE', credentials: 'include' });
    fetchCart();
  }

  document.addEventListener('DOMContentLoaded', fetchCart);

  async function applyTheme() {
    try {
      const res = await fetch(`${API_BASE}/me/`, { credentials: 'include' });
      if (!res.ok) return;
      const user = await res.json();
      const theme = (user.themePreference || "light").toLowerCase().trim();
      const isDark = theme === "dark";
      localStorage.setItem('bookstack-theme', theme);
      document.body.classList.toggle("dark", isDark);
      document.documentElement.classList.toggle("dark", isDark);
    } catch (err) {
      console.error("Theme load failed", err);
    }
    document.body.classList.remove("preload");
  }

  applyTheme();
</script>
</body>
</html>
