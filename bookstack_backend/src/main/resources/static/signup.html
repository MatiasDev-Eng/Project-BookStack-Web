<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookstack Sign Up</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f4f7f6; }
        .login-card { background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 380px; }
        h2 { margin-top: 0; color: #2c3e50; text-align: center; }
        .form-group { margin-bottom: 1.2rem; }
        label { display: block; margin-bottom: 0.5rem; color: #555; font-size: 0.9rem; }
        input { width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; transition: border-color 0.3s; }
        input:focus { outline: none; border-color: #3498db; }
        button { width: 100%; padding: 0.75rem; background-color: #2ecc71; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: bold; margin-top: 1rem; }
        button:hover { background-color: #27ae60; }
        button:disabled { background-color: #bdc3c7; cursor: not-allowed; }

        #message { display: none; margin-top: 1.5rem; padding: 0.75rem; border-radius: 6px; text-align: center; font-size: 0.9rem; }
        .success { display: block !important; background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { display: block !important; background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        
        .login-link { text-align: center; margin-top: 1rem; font-size: 0.85rem; color: #7f8c8d; }
        .login-link a { color: #3498db; text-decoration: none; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Create Account</h2>
    <form id="signupForm">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Min 3 characters" minlength="3" maxlength="20" required>
        </div>
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="email@example.com" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Min 6 characters" minlength="6" maxlength="40" required>
        </div>
        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Repeat password" required>
        </div>
        
        <button type="submit" id="submitBtn">Sign Up</button>
    </form>

    <div id="message"></div>
    
    <div class="login-link">
        Already have an account? <a href="login.html">Sign In</a>
    </div>
</div>

<script>
    const API_BASE = `${window.location.origin}/api`;
    const signupForm = document.getElementById('signupForm');
    const messageDiv = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');

    signupForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        // Basic client-side validation for password match
        if (password !== confirmPassword) {
            messageDiv.textContent = "Passwords do not match!";
            messageDiv.className = "error";
            return;
        }

        // Reset UI
        messageDiv.className = "";
        messageDiv.textContent = "Creating account...";
        submitBtn.disabled = true;

        const payload = {
            username: username,
            email: email,
            password: password,
            role: ["user"] // Defaulting to 'user' role
        };

        try {
            const response = await fetch(`${API_BASE}/auth/signup/`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                messageDiv.textContent = "Registration successful! You can now log in.";
                messageDiv.className = "success";
                signupForm.reset();
            } else {
                const errorData = await response.text();
                messageDiv.textContent = "Signup Failed: " + (errorData || "Check your details");
                messageDiv.className = "error";
            }
        } catch (error) {
            messageDiv.textContent = "Server Error: Could not connect to backend.";
            messageDiv.className = "error";
        } finally {
            submitBtn.disabled = false;
        }

    // This function runs automatically when the page loads
    document.addEventListener('DOMContentLoaded', () => {
        const savedPicUrl = localStorage.getItem('bookstack-profile-pic');
        const profileCircle = document.querySelector('.profile-circle');

        if (savedPicUrl && profileCircle) {
            // Because the backend returns "/uploads/name.jpg", we must add the localhost port!
            const fullImageUrl = `http://localhost:8080${savedPicUrl}`;
            
            // Replace the empty circle with the image tag
            profileCircle.innerHTML = `<img src="${fullImageUrl}" alt="User Profile">`;
        } else if (profileCircle) {
            // Fallback if they haven't uploaded a picture yet
            profileCircle.innerHTML = '👤'; 
        }
    });
    });
</script>

</body>
</html>
