<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Book Listing | Bookstore</title>
    <link rel="stylesheet" href="style.css">
    <script>
        (function() {
            const cached = localStorage.getItem('bookstack-theme');
            if (cached === 'dark') document.documentElement.classList.add('dark');
        })();
    </script>
    <style>
        /* Cover uploader — uses CSS variables for dark mode compatibility */
        .cover-upload-area {
            border: 2px dashed var(--border);
            border-radius: var(--radius);
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            overflow: hidden;
            position: relative;
            min-height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cover-upload-area:hover { border-color: var(--accent); background: var(--bg-subtle); }
        .cover-upload-area.has-image { border-style: solid; border-color: var(--success); }

        #coverPreview {
            width: 100%;
            max-height: 260px;
            object-fit: cover;
            display: none;
            border-radius: var(--radius-sm);
        }
        .cover-upload-area.has-image #coverPreview { display: block; }
        .cover-upload-area.has-image .upload-placeholder { display: none; }

        .upload-placeholder { pointer-events: none; padding: 24px; }
        .upload-placeholder .upload-icon { font-size: 2rem; margin-bottom: 8px; }
        .upload-placeholder p { font-size: 0.9rem; color: var(--muted); margin-bottom: 4px; }
        .upload-placeholder span { font-size: 0.78rem; color: var(--muted); opacity: 0.7; }

        .cover-change-hint {
            font-size: 0.78rem;
            color: var(--muted);
            margin-top: 6px;
            text-align: center;
            display: none;
        }
        .cover-upload-area.has-image ~ .cover-change-hint { display: block; }
        #coverFileInput { display: none; }
    </style>
</head>

<body class="preload">
<div id="notification"></div>
<header class="navbar">
    <div class="nav-content">
        <div class="logo" onclick="window.location.href='homepage.html'" style="cursor:pointer">BookStore</div>
        <div class="profile-container">
            <div class="profile-circle"></div>
        </div>
    </div>
</header>

<div class="container small">
    <div class="dashboard-header">
        <h1>Edit Book Listing</h1>
        <button class="delete-btn" onclick="window.location.href='homepage.html'">Cancel</button>
    </div>

    <div class="form-container">
        <form id="editBookForm">

            <!-- Cover image -->
            <div class="form-group">
                <label>Cover Image</label>
                <div class="cover-upload-area" id="coverUploadArea" onclick="document.getElementById('coverFileInput').click()">
                    <img id="coverPreview" alt="Cover preview">
                    <div class="upload-placeholder">
                        <div class="upload-icon">📷</div>
                        <p>Click to upload a new cover</p>
                        <span>JPG, PNG or WEBP — max 5 MB</span>
                    </div>
                </div>
                <p class="cover-change-hint">Click the image to change it</p>
                <input type="file" id="coverFileInput" accept="image/jpeg,image/png,image/webp">
            </div>

            <div class="form-group">
                <label for="title">Book Title</label>
                <input type="text" id="title" name="title" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="author">Author</label>
                    <input type="text" id="author" name="author" required>
                </div>
                <div class="form-group">
                    <label for="year">Publication Year</label>
                    <input type="number" id="year" name="year" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="isbn">ISBN</label>
                    <input type="text" id="isbn" name="isbn" required>
                </div>
                <div class="form-group">
                    <label for="price">Price ($)</label>
                    <input type="number" id="price" name="price" step="0.01" required>
                </div>
            </div>

            <div class="form-group">
                <label for="condition">Condition</label>
                <select id="condition" name="condition">
                    <option value="NEW">New</option>
                    <option value="LIKE_NEW">Like New</option>
                    <option value="VERY_GOOD">Very Good</option>
                    <option value="GOOD">Good</option>
                    <option value="ACCEPTABLE">Acceptable</option>
                </select>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="5"></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="add-new-btn" id="submitBtn" style="width: 100%; margin-top: 20px;">Update Listing</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
<script src="notifications.js"></script>
<script src="global-init.js"></script>

<script>
    const API_BASE = `${window.location.origin}/api`;
    const urlParams = new URLSearchParams(window.location.search);
    const bookId    = urlParams.get('id');

    if (!bookId) {
        showNotification("No Book ID provided!", "error");
        window.location.href = 'homepage.html';
    }

    function showNotification(message, type = "info") {
        const note = document.getElementById("notification");
        note.innerText     = message;
        note.className     = `notification-${type}`;
        note.style.display = "block";
        setTimeout(() => note.style.display = "none", 3000);
    }

    // ── Cover file picker & preview ───────────────────────────
    document.getElementById('coverFileInput').addEventListener('change', function () {
        const file = this.files[0];
        if (!file) return;

        if (file.size > 5 * 1024 * 1024) {
            showNotification('Image must be under 5 MB.', 'error');
            this.value = '';
            return;
        }

        const reader = new FileReader();
        reader.onload = (e) => {
            document.getElementById('coverPreview').src = e.target.result;
            document.getElementById('coverUploadArea').classList.add('has-image');
        };
        reader.readAsDataURL(file);
    });

    // ── Load existing book data ───────────────────────────────
    async function loadBookData() {
        try {
            const response = await fetch(`${API_BASE}/books/${bookId}`, { credentials: 'include' });
            if (!response.ok) throw new Error("Failed to load book data");

            const book = await response.json();

            document.getElementById('title').value       = book.title        || '';
            document.getElementById('author').value      = book.author       || '';
            document.getElementById('year').value        = book.publishedYear || '';
            document.getElementById('isbn').value        = book.isbn         || '';
            document.getElementById('price').value       = book.price        || '';
            document.getElementById('condition').value   = book.condition    || 'GOOD';
            document.getElementById('description').value = book.description  || '';

            if (book.hasCover) {
                const preview    = document.getElementById('coverPreview');
                const uploadArea = document.getElementById('coverUploadArea');
                preview.src      = `${API_BASE}/books/${bookId}/cover`;
                preview.onload   = () => uploadArea.classList.add('has-image');
                preview.onerror  = () => uploadArea.classList.remove('has-image');
            }

        } catch (error) {
            console.error(error);
            showNotification("Error loading book details.", "error");
        }
    }

    // ── Submit ────────────────────────────────────────────────
    document.getElementById('editBookForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const submitBtn       = document.getElementById('submitBtn');
        submitBtn.disabled    = true;
        submitBtn.textContent = 'Saving...';

        const updatedData = {
            title:         document.getElementById('title').value,
            author:        document.getElementById('author').value,
            publishedYear: parseInt(document.getElementById('year').value),
            isbn:          document.getElementById('isbn').value,
            price:         parseFloat(document.getElementById('price').value),
            condition:     document.getElementById('condition').value,
            description:   document.getElementById('description').value
        };

        try {
            const response = await fetch(`${API_BASE}/books/${bookId}`, {
                method: 'PUT',
                credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(updatedData)
            });

            if (!response.ok) {
                const err = await response.json().catch(() => ({}));
                showNotification("Update failed: " + (err.message || "Unknown error"), "error");
                return;
            }

            const coverFile = document.getElementById('coverFileInput').files[0];
            if (coverFile) {
                submitBtn.textContent = 'Uploading cover...';
                const formData = new FormData();
                formData.append('file', coverFile);

                const coverResponse = await fetch(`${API_BASE}/books/${bookId}/cover`, {
                    method: 'PUT',
                    credentials: 'include',
                    body: formData
                });

                if (!coverResponse.ok) {
                    showNotification('Details saved, but cover upload failed. Try again.', 'info');
                    return;
                }
            }

            showNotification("Listing updated successfully!", "success");
            setTimeout(() => window.location.href = 'homepage.html', 1500);

        } catch (error) {
            console.error("Error:", error);
            showNotification("An error occurred while saving.", "error");
        } finally {
            submitBtn.disabled    = false;
            submitBtn.textContent = 'Update Listing';
        }
    });

    document.addEventListener('DOMContentLoaded', loadBookData);

    async function applyTheme() {
        // Don't attempt if no JWT cookie present
        const hasCookie = document.cookie.includes('bookstack-jwt');
        if (!hasCookie) {
            document.body.classList.remove("preload");
            return;
        }

        try {
            const res = await fetch(`${API_BASE}/me/`, { credentials: 'include' });
            if (!res.ok) {
                document.body.classList.remove("preload");
                return;
            }
            const user = await res.json();
            const theme = user.themePreference || "light";
            localStorage.setItem('bookstack-theme', theme);
            document.body.classList.toggle("dark", theme === "dark");
        } catch (err) {
            console.error("Theme load failed", err);
        }
        document.body.classList.remove("preload");
    }

    applyTheme();
</script>
</body>
</html>
