<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --bg: #f5f5f7;
      --white: #ffffff;
      --primary: #111827;
      --muted: #9ca3af;
      --border: #e5e7eb;
      --accent: #f5a623;
      --radius: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-card {
      background: var(--white);
      width: 100%;
      max-width: 380px;
      padding: 32px 28px;
      border-radius: var(--radius);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .login-title {
      font-size: 1.4rem;
      font-weight: 600;
      text-align: center;
      color: var(--primary);
    }

    .login-subtitle {
      font-size: 0.85rem;
      text-align: center;
      color: var(--muted);
      margin-top: -10px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.85rem;
      color: var(--primary);
    }

    .form-group input {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #f9fafb;
      font-size: 0.9rem;
    }

    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: #f9fafb;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 8px;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .footer-text {
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 4px;
    }
  </style>
</head>

<body>

  <div class="login-card">
    <div class="login-title">Admin Login</div>
    <div class="login-subtitle">Access your dashboard</div>

    <form>
      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" type="text" placeholder="Enter username" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Enter password" />
      </div>

      <button class="btn" type="submit">Log In</button>
    </form>

    <div class="footer-text">© 2026 BookStack Admin</div>
  </div>

</body>
</html>
