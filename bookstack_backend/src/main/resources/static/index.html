<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Bookstack Sign Up</title>
    <script>
        (function() {
            const cached = localStorage.getItem('bookstack-theme');
            if (cached === 'dark') document.documentElement.classList.add('dark');
        })();
    </script>
    <style>
        .age-error {
            font-size: 0.8rem;
            color: var(--danger);
            margin-top: 4px;
            display: none;
        }
        .dob-hint {
            font-size: 0.78rem;
            color: var(--muted);
            margin-top: 4px;
        }
    </style>
</head>
<body class="preload">

<div class="login-card">
    <h2>Create Account</h2>
    <form id="signupForm">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Min 3 characters" minlength="3" maxlength="20" required>
        </div>
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="email@example.com" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Min 10 characters" minlength="10" maxlength="40" required>
        </div>
        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Repeat password" required>
        </div>

        <!-- Date of birth -->
        <div class="form-group">
            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" required>
            <div class="dob-hint">You must be at least 13 years old to create an account.</div>
            <div class="age-error" id="ageError">⚠️ You must be at least 13 years old to sign up.</div>
        </div>

        <button type="submit" id="submitBtn">Sign Up</button>
    </form>

    <div id="message"></div>

    <div class="login-link">
        Already have an account? <a href="login.html">Sign In</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
<script src="notifications.js"></script>
<script src="global-init.js"></script>

<script>
    const API_BASE = `${window.location.origin}/api`;
    const signupForm = document.getElementById('signupForm');
    const messageDiv = document.getElementById('message');
    const submitBtn  = document.getElementById('submitBtn');
    const dobInput   = document.getElementById('dob');
    const ageError   = document.getElementById('ageError');

    // Set max date on dob input to today
    const today = new Date();
    dobInput.max = today.toISOString().split('T')[0];

    // Set min date to 150 years ago (reasonable limit)
    const minDate = new Date();
    minDate.setFullYear(minDate.getFullYear() - 150);
    dobInput.min = minDate.toISOString().split('T')[0];

    function getAge(dobValue) {
        const dob  = new Date(dobValue);
        const now  = new Date();
        let age    = now.getFullYear() - dob.getFullYear();
        const m    = now.getMonth() - dob.getMonth();
        if (m < 0 || (m === 0 && now.getDate() < dob.getDate())) age--;
        return age;
    }

    // Live age validation as user picks a date
    dobInput.addEventListener('change', () => {
        if (!dobInput.value) { ageError.style.display = 'none'; return; }
        const age = getAge(dobInput.value);
        if (age < 13) {
            ageError.style.display = 'block';
            dobInput.style.borderColor = 'var(--danger)';
        } else {
            ageError.style.display = 'none';
            dobInput.style.borderColor = 'var(--success)';
        }
    });

    signupForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const dob             = dobInput.value;

        // Password match
        if (password !== confirmPassword) {
            messageDiv.textContent = "Passwords do not match!";
            messageDiv.className   = "error";
            return;
        }

        // Age check
        if (!dob) {
            messageDiv.textContent = "Please enter your date of birth.";
            messageDiv.className   = "error";
            return;
        }

        const age = getAge(dob);
        if (age < 13) {
            ageError.style.display = 'block';
            messageDiv.textContent = "You must be at least 13 years old to sign up.";
            messageDiv.className   = "error";
            return;
        }
        const passwordRegex = /^(?=.*[a-zA-Z])(?=.*\d)(?=.*[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]).{10,}$/;
        if (!passwordRegex.test(password)) {
            messageDiv.textContent = "Password must be at least 10 characters and include at least one letter, number, and punctuation symbol.";
            messageDiv.className   = "error";
            return;
        }
        // Reset UI
        messageDiv.className = "";
        messageDiv.textContent = "Creating account...";
        submitBtn.disabled = true;

        const payload = {
            username: username,
            email: email,
            password: password,
            role: ["user"] // Defaulting to 'user' role
        };

        try {
            const response = await fetch(`${API_BASE}/auth/signup/`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                messageDiv.textContent = "Registration successful! You can now log in.";
                messageDiv.className = "success";
                signupForm.reset();
                ageError.style.display  = 'none';
                dobInput.style.borderColor = '';
            } else {
                const errorData = await response.text();
                messageDiv.textContent = "Signup Failed: " + (errorData || "Check your details");
                messageDiv.className = "error";
            }
        } catch (error) {
            messageDiv.textContent = "Server Error: Could not connect to backend.";
            messageDiv.className = "error";
        } finally {
            submitBtn.disabled = false;
        }
    });

    async function applyTheme() {
        const cached = localStorage.getItem('bookstack-theme');
        if (cached) {
            const isDark = cached === 'dark';
            document.body.classList.toggle("dark", isDark);
            document.documentElement.classList.toggle("dark", isDark);
        }
        const hasCookie = document.cookie.includes('bookstack-jwt');
        if (!hasCookie) {
            document.body.classList.remove("preload");
            return;
        }
        try {
            const res = await fetch(`${API_BASE}/me/`, { credentials: 'include' });
            if (!res.ok) { document.body.classList.remove("preload"); return; }
            const user   = await res.json();
            const theme  = (user.themePreference || "light").toLowerCase().trim();
            const isDark = theme === "dark";
            localStorage.setItem('bookstack-theme', theme);
            document.body.classList.toggle("dark", isDark);
            document.documentElement.classList.toggle("dark", isDark);
        } catch (err) {
            console.error("Theme load failed", err);
        }
        document.body.classList.remove("preload");
    }

    applyTheme();
</script>
</body>
</html>
