<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | BookStack</title>

    <style>
        /* Global Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f5f5f5;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Navbar */
        .navbar {
            background-color: #ffffff;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #4a76e8;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            text-decoration: none;
            color: #333;
            font-size: 16px;
        }

        .nav-links a:hover {
            color: #4a76e8;
        }

        /* 404 Content */
        .error-container {
            text-align: center;
            padding: 80px 20px;
            flex: 1;
        }

        .error-code {
            font-size: 100px;
            font-weight: bold;
            color: #4a76e8;
        }

        .error-message {
            font-size: 20px;
            margin: 20px 0;
            color: #555;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            background-color: #4a76e8;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-size: 16px;
        }

        .btn:hover {
            background-color: #3a5ec4;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 15px;
            background-color: #ffffff;
            border-top: 1px solid #ddd;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="logo">BookStack</div>
        <ul class="nav-links">
            <li><a href="homepage.html">Home</a></li>
            <li><a href="see_listings.html">Browse</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </nav>

    <!-- Main 404 Content -->
    <section class="error-container">
        <h1 class="error-code">404</h1>
        <p class="error-message">Oops! The page you're looking for doesn't exist.</p>
        <a href="homepage.html" class="btn">Return to Home</a>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 BookStack. All rights reserved.</p>
    </footer>

</body>
</html>
