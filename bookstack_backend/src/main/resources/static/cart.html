<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Your Cart | BookStack</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css">
  <script>
    (function() {
      const cached = localStorage.getItem('bookstack-theme');
      if (cached === 'dark') document.documentElement.classList.add('dark');
    })();
  </script>
  <style>
    /* Nav avatar photo support */
    .user-profile-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: none;
    }
    .user-profile-btn.has-photo img        { display: block; }
    .user-profile-btn.has-photo .nav-emoji { display: none; }
  </style>
</head>

<body class="preload">
<div id="notification"></div>

<nav>
  <div class="nav-left">
    <a href="homepage.html" class="logo">BookStack</a>
  </div>
 
  <div class="nav-right" style="margin-left: auto;">
    <a href="admin_usermanagement.html" id="adminBtn" class="publish-btn admin-btn" style="display: none;">
      🛡️ Admin
    </a>
    <a href="publish_book.html" class="publish-btn"><span>+</span> Publish Book</a>
    <div class="nav-icon-btn" onclick="window.location.href='wishlist.html'">❤️</div>
    <div class="nav-icon-btn" onclick="window.location.href='cart.html'">🛒</div>
    <div class="user-profile-btn" onclick="window.location.href='account.html'">
      <img id="navAvatar" alt="Profile">
      <span class="nav-emoji">👤</span>
    </div>
  </div>
</nav>

<div class="cart-container">
  <a href="homepage.html" class="nav-link">← Continue Shopping</a>
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 24px;">
      <div class="cart-title">Your Shopping Cart</div>
      <button id="clearCartBtn" class="delete-btn" onclick="clearCart()" style="display:none;">
          🗑️ Empty Cart
      </button>
  </div>
  <table>
    <thead>
    <tr>
      <th>Book</th>
      <th>Price</th>
      <th>Qty</th>
      <th>Total</th>
      <th>Action</th>
    </tr>
    </thead>
    <tbody id="cartTableBody">
    </tbody>
  </table>

  <div class="cart-summary" style="flex-direction: column; align-items: flex-end; gap: 8px;">
      <div style="display:flex; justify-content:space-between; width:260px; font-size:0.95rem;">
          <span>Subtotal:</span>
          <span id="subtotalAmount">$0.00</span>
      </div>
      <div style="display:flex; justify-content:space-between; width:260px; font-size:0.95rem; color:var(--muted);">
          <span>Tax (7%):</span>
          <span id="taxAmount">$0.00</span>
      </div>
      <div style="display:flex; justify-content:space-between; width:260px; font-size:1.15rem; font-weight:800; border-top:2px solid var(--border); padding-top:8px;">
          <span>Grand Total:</span>
          <span id="totalAmount">$0.00</span>
      </div>
      <button id="checkoutBtn" class="checkout-btn" onclick="showCheckoutSection()">Proceed to Checkout</button>
  </div>

  <div id="addressSection" class="address-section">
    <h3>Checkout Details</h3>

    <label class="form-label">Delivery Address</label>
    <textarea id="deliveryAddress" class="address-input" rows="2" placeholder="123 Street Name, City, Zip Code"></textarea>

    <label class="form-label">Select Payment Method</label>
    <select id="cardSelect" class="card-select">
      <option value="">Loading saved cards...</option>
    </select>
    <p style="font-size: 0.8rem; color: var(--muted); margin-top: 6px;">
      <a href="my_cards.html">+ Add a new card in Account Settings</a>
    </p>
    <div style="background:var(--bg-subtle); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 16px; margin-bottom:16px; font-size:0.85rem;">
        <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
            <span style="color:var(--muted);">Subtotal</span>
            <span id="checkoutSubtotal">$0.00</span>
        </div>
        <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
            <span style="color:var(--muted);">Tax (7%)</span>
            <span id="checkoutTax">$0.00</span>
        </div>
        <div style="display:flex; justify-content:space-between; font-weight:800; font-size:1rem; border-top:1px solid var(--border); padding-top:8px; margin-top:4px;">
            <span>Total Charged</span>
            <span style="color:var(--price);" id="checkoutTotal">$0.00</span>
        </div>
    </div>
    <div class="address-actions">
      <button class="cancel-btn" onclick="hideCheckoutSection()">Cancel</button>
      <button id="confirmOrderBtn" class="confirm-btn" onclick="handleCheckout()">Confirm Order</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
<script src="notifications.js"></script>
<script src="global-init.js"></script>

<script>
  const API_BASE = `${window.location.origin}/api`;

  async function checkAdminStatus() {
    try {
      const res = await fetch(`${API_BASE}/auth/me/`, { credentials: 'include' });
      if (res.ok) {
        const user = await res.json();
        if (user.roles && user.roles.includes('ROLE_ADMIN')) {
          document.getElementById('adminBtn').style.display = 'flex';
        }
        try {
          const picRes = await fetch(`${API_BASE}/me/profile-picture`, { credentials: 'include' });
          if (picRes.ok) {
            const blob       = URL.createObjectURL(await picRes.blob());
            const navAvatar  = document.getElementById('navAvatar');
            const profileBtn = document.querySelector('.user-profile-btn');
            navAvatar.src    = blob;
            navAvatar.onload = () => profileBtn.classList.add('has-photo');
          }
        } catch (e) { /* no picture */ }
      }
    } catch (e) {
      console.warn("Admin check failed:", e);
    }
  }

  function showNotification(message, type = "info") {
    const note = document.getElementById("notification");
    note.innerText = message;
    note.className = `notification-${type}`;
    note.style.display = "block";
    setTimeout(() => { note.style.display = "none"; }, 3000);
  }

  async function fetchCart() {
    try {
      const response = await fetch(`${API_BASE}/cart/`, { credentials: 'include' });
      if (!response.ok) throw new Error("Unauthorized");
      const items = await response.json();
      renderCart(items);
    } catch (err) {
      showNotification("Failed to load cart", "error");
    }
  }

  function renderCart(items) {
    const tbody = document.getElementById('cartTableBody');
    const totalSpan = document.getElementById('totalAmount');
    const checkoutBtn = document.getElementById('checkoutBtn');

    tbody.innerHTML = '';
    let grandTotal = 0;

    if (!items || items.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Your cart is empty.</td></tr>';
      checkoutBtn.disabled = true;
    } else {
      checkoutBtn.disabled = false;
      items.forEach(item => {
        const itemTotal = item.price * item.quantity;
        grandTotal += itemTotal;
        tbody.innerHTML += `
          <tr>
            <td><strong>${item.title}</strong></td>
            <td>$${item.price.toFixed(2)}</td>
            <td>
              <input type="number" class="qty-input" value="${item.quantity}"
                    min="1" max="${item.stock ?? 999}"
                    onchange="updateQty(${item.cartItemId}, this.value, ${item.stock ?? 999})"
                    min="1">
            </td>
            <td>$${itemTotal.toFixed(2)}</td>
            <td>
              <button class="remove-btn" id="remove-btn-${item.cartItemId}" onclick="showInlineConfirm(${item.cartItemId})">Remove</button>
              <span id="confirm-span-${item.cartItemId}" class="inline-confirm">
                Sure? <button onclick="removeItem(${item.cartItemId})">Yes</button>
                <button onclick="hideInlineConfirm(${item.cartItemId})">No</button>
              </span>
            </td>
          </tr>
        `;
      });
    }
    document.getElementById('clearCartBtn').style.display = 
        (!items || items.length === 0) ? 'none' : 'inline-flex';
    const tax_rate = 0.07;
    const tax = grandTotal * tax_rate;
    const total = grandTotal + tax;

    document.getElementById('subtotalAmount').innerText = `$${grandTotal.toFixed(2)}`;
    document.getElementById('taxAmount').innerText = `$${tax.toFixed(2)}`;
    document.getElementById('totalAmount').innerText = `$${total.toFixed(2)}`;
  
    document.getElementById('checkoutSubtotal').innerText = `$${grandTotal.toFixed(2)}`;
    document.getElementById('checkoutTax').innerText = `$${tax.toFixed(2)}`;
    document.getElementById('checkoutTotal').innerText = `$${total.toFixed(2)}`;
  }

  async function fetchSavedCards() {
    const cardSelect = document.getElementById('cardSelect');
    const token = localStorage.getItem('token');

    try {
      const response = await fetch(`${API_BASE}/payments/cards/`, {
        method: 'GET',
        headers: { 'Authorization': `Bearer ${token}` }
      });

      if (response.ok) {
        const cards = await response.json();
        if (cards.length === 0) {
          cardSelect.innerHTML = '<option value="">No saved cards found</option>';
        } else {
          cardSelect.innerHTML = '<option value="">-- Choose a Card --</option>' +
            cards.map(card => `<option value="${card.cardId}">${card.cardNumber} (${card.cardHolderName})</option>`).join('');
        }
      } else {
        cardSelect.innerHTML = '<option value="">Error loading cards</option>';
      }
    } catch (err) {
      cardSelect.innerHTML = '<option value="">Connection error</option>';
    }
  }

  function showCheckoutSection() {
    document.getElementById('addressSection').style.display = 'block';
    document.getElementById('checkoutBtn').style.display = 'none';
    fetchSavedCards();
    loadSavedAddress();
    document.getElementById('addressSection').scrollIntoView({ behavior: 'smooth' });
  }

  async function loadSavedAddress() {
    try {
        const res = await fetch(`${API_BASE}/me/address`, { credentials: 'include' });
        if (res.ok) {
            const addr = await res.text();
            if (addr) document.getElementById('deliveryAddress').value = addr;
        }
    } catch (e) { /* leave blank */ }
  }

  function hideCheckoutSection() {
    document.getElementById('addressSection').style.display = 'none';
    document.getElementById('checkoutBtn').style.display = 'block';
  }

  async function handleCheckout() {
    const deliveryAddress = document.getElementById('deliveryAddress').value.trim();
    const selectedCard = document.getElementById('cardSelect').value;

    if (!deliveryAddress) {
      showNotification("Please enter a delivery address.", "error");
      return;
    }
    if (!selectedCard) {
      showNotification("Please select a payment method.", "error");
      return;
    }

    const btn = document.getElementById('confirmOrderBtn');
    btn.disabled = true;
    btn.innerText = "Processing...";

    const payload = {
      deliveryAddress: deliveryAddress,
      cardId: parseInt(selectedCard)
    };

    try {
      const response = await fetch(`${API_BASE}/orders/`, {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (response.ok) {
        showNotification("Order placed successfully!", "success");
        setTimeout(() => { window.location.href = 'orders.html'; }, 1500);
      } else {
        const errorMsg = await response.text();
        showNotification("Checkout failed: " + errorMsg, "error");
        btn.disabled = false;
        btn.innerText = "Confirm Order";
      }
    } catch (err) {
      btn.disabled = false;
      btn.innerText = "Confirm Order";
      showNotification("A connection error occurred.", "error");
    }
  }

  function showInlineConfirm(itemId) {
    document.getElementById(`remove-btn-${itemId}`).style.display = 'none';
    document.getElementById(`confirm-span-${itemId}`).style.display = 'inline';
  }

  function hideInlineConfirm(itemId) {
    document.getElementById(`remove-btn-${itemId}`).style.display = 'inline';
    document.getElementById(`confirm-span-${itemId}`).style.display = 'none';
  }

  async function updateQty(itemId, newQty, maxStock) {
      const qty = Math.max(1, Math.min(parseInt(newQty), maxStock));
      await fetch(`${API_BASE}/cart/update-quantity/${itemId}/?quantity=${qty}`, { 
          method: 'PUT', 
          credentials: 'include' 
      });
      fetchCart();
  }

  async function removeItem(itemId) {
    await fetch(`${API_BASE}/cart/remove/${itemId}/`, { method: 'DELETE', credentials: 'include' });
    fetchCart();
  }

  document.addEventListener('DOMContentLoaded', () => {
    checkAdminStatus();
    fetchCart();
  });

  async function clearCart() {
      if (!confirm("Empty your entire cart?")) return;
      try {
          const res = await fetch(`${API_BASE}/cart/clear/`, {
              method: 'DELETE',
              credentials: 'include'
          });
          if (res.ok) {
              showNotification("Cart cleared.", "info");
              fetchCart();
          } else {
              showNotification("Failed to clear cart.", "error");
          }
      } catch (err) {
          showNotification("Network error.", "error");
      }
  }

    async function applyTheme() {
        // Apply cached theme instantly
        const cached = localStorage.getItem('bookstack-theme');
        if (cached) {
            const isDark = cached === 'dark';
            document.body.classList.toggle("dark", isDark);
            document.documentElement.classList.toggle("dark", isDark);
        }

        // Then verify from server if cookie present
        const hasCookie = document.cookie.includes('bookstack-jwt');
        if (!hasCookie) {
            document.body.classList.remove("preload");
            return;
        }
        try {
            const res = await fetch(`${API_BASE}/me/`, { credentials: 'include' });
            if (!res.ok) { document.body.classList.remove("preload"); return; }
            const user   = await res.json();
            const theme  = (user.themePreference || "light").toLowerCase().trim();
            const isDark = theme === "dark";
            localStorage.setItem('bookstack-theme', theme);
            document.body.classList.toggle("dark", isDark);
            document.documentElement.classList.toggle("dark", isDark);
        } catch (err) {
            console.error("Theme load failed", err);
        }
        document.body.classList.remove("preload");
    }

    applyTheme();
</script>
</body>
</html>
