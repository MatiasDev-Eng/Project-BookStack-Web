<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Account | BookStore</title>
    <link rel="stylesheet" href="style.css">
    <script>
        (function() {
        const cached = localStorage.getItem('bookstack-theme');
        if (cached === 'dark') document.documentElement.classList.add('dark');
        })();
    </script>
</head>

<body class="preload">
<header class="navbar">
    <div class="nav-content">
        <div class="logo" onclick="window.location.href='homepage.html'" style="cursor:pointer">BookStore</div>
    </div>
</header>

<div class="theme-toggle-wrapper">
    <label class="theme-toggle" title="Toggle dark mode">
        <input type="checkbox" id="theme-checkbox">
        <span class="toggle-track">
            <span class="toggle-thumb"></span>
        </span>
    </label>
</div>

<div class="container">
    <h1 style="text-align: center; ">Account Settings</h1>
    <div id="statusMessage" style="text-align: center; margin-bottom: 1.5rem; min-height: 1.2rem; font-size: 0.9rem;"></div>

    <div class="balance-card">
        <div class="balance-label">Your Wallet Balance</div>
        <div id="balanceDisplay" class="balance-amount">$0.00</div>
        <button id="retrieveBtn" class="retrieve-btn">Retrieve Funds</button>
    </div>

    <div class="profile-section">
        <div class="avatar-circle">👤</div>
    </div>

    <div class="form-group">
        <label><strong>Username</strong></label>
        <input type="text" id="usernameInput" readonly>
    </div>

    <div class="form-group">
        <label><strong>Email Address</strong></label>
        <input type="email" id="emailInput">
    </div>

    <div class="form-group">
        <label><strong>Shipping Address</strong></label>
        <input type="text" id="addressInput" placeholder="Enter your full address">
    </div>

    <button class="submit-btn">Update Profile</button>

    <div style="margin-top: 1.5rem; display: flex; flex-direction: column; gap: 0.75rem;">
        <button class="submit-btn" onclick="window.location.href='orders.html'">
            View Orders
        </button>

        <button class="submit-btn" onclick="window.location.href='my_cards.html'">
            My Saved Cards
        </button>

        <button class="submit-btn" onclick="window.location.href='my_books.html'">
            My Books
        </button>
    </div>
</div>

<script>
    const API_BASE = `${window.location.origin}/api`;

    // Currency Formatter
    const usd = new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency: 'USD'
    });

    function updateStatus(text, type = 'success') {
        const el = document.getElementById('statusMessage');
        el.textContent = text;
        el.style.color = type === 'error' ? '#dc2626' : '#059669';
        setTimeout(() => el.textContent = "", 5000);
    }

    async function initPage() {
        try {
            const response = await fetch(`${API_BASE}/me/`, {
                method: 'GET',
                credentials: 'include'
            });

            if (response.ok) {
                const user = await response.json();
                document.getElementById('usernameInput').value = user.username || "";
                document.getElementById('emailInput').value = user.email || "";
                document.getElementById('balanceDisplay').textContent = usd.format(user.balance || 0);
            } else if (response.status === 401) {
                window.location.href = 'login.html';
            }
        } catch (e) {
            updateStatus("Failed to connect to server.", "error");
        }
    }

    async function handleRetrieveFunds() {
        const btn = document.getElementById('retrieveBtn');
        const balanceDisplay = document.getElementById('balanceDisplay');

        btn.disabled = true;
        const originalText = btn.textContent;
        btn.textContent = "Processing...";

        try {
            const response = await fetch(`${API_BASE}/payments/retrieve-balance/`, {
                method: 'POST',
                credentials: 'include'
            });

            if (response.ok) {
                const retrievedAmount = await response.json();
                balanceDisplay.textContent = usd.format(0);
                updateStatus(`${usd.format(retrievedAmount)} successfully moved to your bank account!`);
            } else {
                updateStatus("Could not process retrieval.", "error");
            }
        } catch (e) {
            updateStatus("Network error occurred.", "error");
        } finally {
            btn.disabled = false;
            btn.textContent = originalText;
        }
    }

    // Initialization
    document.addEventListener('DOMContentLoaded', () => {
        initPage();
        document.getElementById('retrieveBtn').addEventListener('click', handleRetrieveFunds);
    });

    const themeCheckbox = document.getElementById('theme-checkbox');

    // Load theme from backend
    async function loadTheme() {
        const res = await fetch(`${API_BASE}/me/`, { credentials: 'include' });
        if (!res.ok) return;

        const user = await res.json();
        const theme = user.themePreference || 'light';
        const isDark = theme === 'dark';

        // Apply theme
        document.body.classList.toggle('dark', theme === 'dark');
        document.documentElement.classList.toggle('dark', isDark);

        // Set checkbox
        themeCheckbox.checked = theme === 'dark';
        
        localStorage.setItem('bookstack-theme', theme);
        
        document.body.classList.remove("preload");
    }

    // Toggle theme
    themeCheckbox.addEventListener('change', async () => {
        const theme = themeCheckbox.checked ? 'dark' : 'light';

        // Apply instantly
        document.body.classList.toggle('dark', theme === 'dark');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        
        localStorage.setItem('bookstack-theme', theme);

        // Save to backend
        await fetch(`${API_BASE}/me/theme`, {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ theme })
        });
    });

    // Initialize
    loadTheme();
</script>
</body>
</html>
