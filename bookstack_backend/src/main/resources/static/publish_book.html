<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publish a Book | BookStack</title>
    <link rel="stylesheet" href="style.css">
    <script>
        (function() {
            const cached = localStorage.getItem('bookstack-theme');
            if (cached === 'dark') document.documentElement.classList.add('dark');
        })();
    </script>
    <style>
        /* Cover image uploader — uses CSS variables for dark mode */
        .cover-upload-area {
            border: 2px dashed var(--border);
            border-radius: var(--radius);
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            position: relative;
        }
        .cover-upload-area:hover { border-color: var(--accent); background: var(--bg-subtle); }
        .cover-upload-area.has-image { border-style: solid; border-color: var(--success); padding: 0; overflow: hidden; }

        #coverPreview {
            display: none;
            width: 100%;
            max-height: 260px;
            object-fit: cover;
            border-radius: var(--radius-sm);
        }
        .cover-upload-area.has-image #coverPreview  { display: block; }
        .cover-upload-area.has-image .upload-placeholder { display: none; }

        .upload-placeholder { pointer-events: none; }
        .upload-placeholder .upload-icon { font-size: 2rem; margin-bottom: 8px; }
        .upload-placeholder p    { font-size: 0.9rem; color: var(--muted); margin-bottom: 4px; }
        .upload-placeholder span { font-size: 0.78rem; color: var(--muted); opacity: 0.7; }

        #coverFileInput { display: none; }

        .cover-change-hint {
            display: none;
            font-size: 0.78rem;
            color: var(--muted);
            margin-top: 6px;
            text-align: center;
        }
        .cover-upload-area.has-image + .cover-change-hint { display: block; }
    </style>
</head>

<body class="preload">
<div id="notification"></div>

<nav>
    <div class="nav-left">
        <a href="homepage.html" class="logo">BookStack</a>
    </div>
    <div class="nav-right">
        <div class="nav-icon-btn" onclick="window.location.href='homepage.html'" title="Back Home">🏠</div>
        <div class="nav-icon-btn" onclick="window.location.href='cart.html'" title="View Cart">🛒</div>
        <div class="nav-icon-btn" onclick="window.location.href='account.html'" title="My Account">👤</div>
    </div>
</nav>

<div class="container">
    <div class="header-section">
        <h1>Seller Dashboard</h1>
        <p style="color: var(--muted)">Fill in the details to list your book for sale.</p>
    </div>

    <div class="form-card">
        <form id="publishForm">

            <!-- Cover image -->
            <div class="form-group">
                <label>Cover Image <span style="font-weight:400; color: var(--muted);">(optional)</span></label>
                <div class="cover-upload-area" id="coverUploadArea" onclick="document.getElementById('coverFileInput').click()">
                    <img id="coverPreview" alt="Cover preview">
                    <div class="upload-placeholder">
                        <div class="upload-icon">📷</div>
                        <p>Click to upload a cover photo</p>
                        <span>JPG, PNG or WEBP — max 5 MB</span>
                    </div>
                </div>
                <p class="cover-change-hint">Click the image to change it</p>
                <input type="file" id="coverFileInput" accept="image/jpeg,image/png,image/webp">
            </div>

            <div class="form-group">
                <label for="title">Book Title</label>
                <input type="text" id="title" required placeholder="e.g. The Great Gatsby">
            </div>

            <div class="form-group">
                <label for="author">Author</label>
                <input type="text" id="author" required placeholder="e.g. F. Scott Fitzgerald">
            </div>

            <div class="form-group">
                <label for="isbn">ISBN Number</label>
                <input type="text" id="isbn" required placeholder="e.g. 978247291759">
            </div>

            <div class="form-row" style="grid-template-columns: 2fr 1fr;">
                <div class="form-group">
                    <label for="genre">Genre</label>
                    <input type="text" id="genre" required placeholder="Fiction, History...">
                </div>
                <div class="form-group">
                    <label for="edition">Edition</label>
                    <input type="text" id="edition" placeholder="1st, 2nd...">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="year">Year</label>
                    <input type="number" id="year" min="1000" max="2026" required>
                </div>
                <div class="form-group">
                    <label for="price">Price ($)</label>
                    <input type="number" id="price" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="stock">In Stock</label>
                    <input type="number" id="stock" min="1" required value="1">
                </div>
            </div>

            <div class="form-group">
                <label for="condition">Condition</label>
                <select id="condition" required>
                    <option value="">Select Condition</option>
                    <option value="NEW">New</option>
                    <option value="LIKE_NEW">Like New</option>
                    <option value="VERY_GOOD">Very Good</option>
                    <option value="GOOD">Good</option>
                    <option value="ACCEPTABLE">Acceptable</option>
                </select>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" rows="4" placeholder="Tell buyers about the book..."></textarea>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Post Listing</button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
<script src="notifications.js"></script>
<script src="global-init.js"></script>

<script>
    const API_BASE = `${window.location.origin}/api`;

    function showNotification(message, type = 'info') {
        const note = document.getElementById('notification');
        note.innerText     = message;
        note.className     = `notification-${type}`;
        note.style.display = 'block';
        setTimeout(() => note.style.display = 'none', 3000);
    }

    function getSavedUserId() {
        return localStorage.getItem('bookstack-user-id');
    }

    // ── Cover image preview ───────────────────────────────────
    document.getElementById('coverFileInput').addEventListener('change', function () {
        const file = this.files[0];
        if (!file) return;

        if (file.size > 5 * 1024 * 1024) {
            showNotification('Image must be under 5 MB.', 'error');
            this.value = '';
            return;
        }

        const reader = new FileReader();
        reader.onload = (e) => {
            document.getElementById('coverPreview').src = e.target.result;
            document.getElementById('coverUploadArea').classList.add('has-image');
        };
        reader.readAsDataURL(file);
    });

    // ── Form submit ───────────────────────────────────────────
    document.getElementById('publishForm').addEventListener('submit', async function (event) {
        event.preventDefault();

        const currentUserId = getSavedUserId();
        if (!currentUserId) {
            showNotification("Session expired. Please log in again.", "error");
            setTimeout(() => window.location.href = 'login.html', 1500);
            return;
        }

        const submitBtn       = document.getElementById('submitBtn');
        submitBtn.disabled    = true;
        submitBtn.textContent = 'Posting...';

        const bookData = {
            ownerId:       Number(currentUserId),
            stock:         parseInt(document.getElementById('stock').value),
            price:         parseFloat(document.getElementById('price').value),
            title:         document.getElementById('title').value,
            author:        document.getElementById('author').value,
            genre:         document.getElementById('genre').value,
            edition:       document.getElementById('edition').value,
            condition:     document.getElementById('condition').value,
            publishedYear: parseInt(document.getElementById('year').value),
            description:   document.getElementById('description').value,
            isbn:          document.getElementById('isbn').value,
        };

        try {
            // Step 1: create the listing
            const response = await fetch(`${API_BASE}/books/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify(bookData)
            });

            if (!response.ok) {
                const errData = await response.json().catch(() => ({}));
                showNotification(`Error: ${errData.message || 'Failed to list book'}`, 'error');
                return;
            }

            const savedBook = await response.json();

            // Step 2: upload cover if selected
            const coverFile = document.getElementById('coverFileInput').files[0];
            if (coverFile) {
                submitBtn.textContent = 'Uploading cover...';
                const formData = new FormData();
                formData.append('file', coverFile);

                const coverResponse = await fetch(`${API_BASE}/books/${savedBook.bookId}/cover`, {
                    method: 'PUT',
                    credentials: 'include',
                    body: formData
                });

                if (!coverResponse.ok) {
                    showNotification('Book listed, but cover upload failed. You can re-upload from your listings.', 'info');
                    setTimeout(() => window.location.href = 'homepage.html', 2500);
                    return;
                }
            }

            showNotification('Book listed successfully!', 'success');
            setTimeout(() => window.location.href = 'homepage.html', 1500);

        } catch (error) {
            showNotification('Connection error. Is the server running?', 'error');
            console.error(error);
        } finally {
            submitBtn.disabled    = false;
            submitBtn.textContent = 'Post Listing';
        }
    });

    // ── Theme ─────────────────────────────────────────────────
    async function applyTheme() {
        // Don't attempt if no JWT cookie present
        const hasCookie = document.cookie.includes('bookstack-jwt');
        if (!hasCookie) {
            document.body.classList.remove("preload");
            return;
        }

        try {
            const res = await fetch(`${API_BASE}/me/`, { credentials: 'include' });
            if (!res.ok) {
                document.body.classList.remove("preload");
                return;
            }
            const user = await res.json();
            const theme = user.themePreference || "light";
            localStorage.setItem('bookstack-theme', theme);
            document.body.classList.toggle("dark", theme === "dark");
        } catch (err) {
            console.error("Theme load failed", err);
        }
        document.body.classList.remove("preload");
    }

    applyTheme();
</script>
</body>
</html>
