<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Content | Bookstore</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="navbar">
        <div class="nav-content">
            <div class="logo" onclick="window.location.href='homepage.html'" style="cursor:pointer">BookStore</div>

            <div class="search-container">
                <input type="text" placeholder="Search for books, authors, or ISBN...">
                <button class="search-btn">&#128269;</button>
                <button class="add-new-btn" id="filterBtn">Filter</button>
            </div>

            <div class="nav-icons" style="display: flex; align-items: center; gap: 1rem;">
                <a href="wishlist.html" class="cart-btn" style="font-size: 1.4rem; text-decoration: none;">&#10084;</a>
                <a href="cart.html" class="cart-btn" style="font-size: 1.4rem; text-decoration: none;">&#128722;</a>
                <div class="profile-container">
                    <div class="profile-circle"></div>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <h1>Report Content</h1>

        <div class="form-group">
            <label><strong>Reason for Report</strong></label>
            <select>
                <option>Inappropriate Content</option>
                <option>Spam or Scam</option>
                <option>Harassment</option>
                <option>Incorrect Information</option>
                <option>Other</option>
            </select>
        </div>

        <div class="form-group">
            <label><strong>Additional Details (optional)</strong></label>
            <textarea placeholder="Describe the issue..." rows="5"></textarea>
        </div>

        <button class="submit-btn" style="margin-top: 1rem;">Submit Report</button>
        <button class="cancel-btn" style="margin-top: 1rem; margin-left: 10px;">Cancel</button>
    </div>

    <script>
        document.getElementById("filterBtn").addEventListener("click", () => {
            console.log("Filter options coming soon!");
        });
    </script>
</body>
</html>
