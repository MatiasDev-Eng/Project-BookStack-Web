<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Order Details | BookStack</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --bg: #f8fafc; --white: #ffffff; --primary: #1e293b;
            --border: #e2e8f0; --accent: #2563eb; --radius: 12px;
            --muted: #64748b;
        }
        body { background: var(--bg); font-family: system-ui, sans-serif; padding: 40px 5%; margin: 0; }
        .container { max-width: 850px; margin: 0 auto; background: var(--white); padding: 30px; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid var(--bg); padding-bottom: 20px; }
        .title { font-size: 1.8rem; font-weight: 700; color: var(--primary); margin: 0; }

        .nav-link { display: inline-block; margin-bottom: 20px; color: var(--accent); text-decoration: none; font-weight: 500; }

        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 40px; }
        .info-section h4 { text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1px; color: var(--muted); margin-bottom: 10px; }
        .info-content { font-size: 1rem; color: var(--primary); line-height: 1.5; }

        table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
        th { text-align: left; padding: 12px; border-bottom: 2px solid var(--border); color: var(--muted); font-size: 0.85rem; text-transform: uppercase; }
        td { padding: 16px 12px; border-bottom: 1px solid var(--border); }

        .book-title { font-weight: 600; color: var(--primary); }
        .price-col { text-align: right; }

        .order-summary { margin-left: auto; max-width: 300px; }
        .summary-row { display: flex; justify-content: space-between; padding: 10px 0; font-size: 1rem; }
        .total-row { border-top: 2px solid var(--primary); margin-top: 10px; padding-top: 15px; font-weight: 800; font-size: 1.4rem; color: #059669; }

        .badge { padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .badge-ordered { background: #dbeafe; color: #1e40af; }
        .badge-transit { background: #fef3c7; color: #92400e; }
        .badge-delivered { background: #dcfce7; color: #166534; }
        .badge-default { background: #f1f5f9; color: #475569; }

        .error-msg { color: #ef4444; text-align: center; padding: 50px; }
    </style>
</head>
<body>

<div class="container">
    <a href="orders.html" class="nav-link">← Back to My Orders</a>

    <div id="detailsContent">
        <p style="text-align: center; color: var(--muted);">Fetching order details...</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>

<script src="notifications.js"></script>
<script src="global-init.js"></script>


<script>
    const API_BASE = `${window.location.origin}/api`;

    function getStatusClass(status) {
        if (!status) return 'badge-default';
        switch (status.toUpperCase()) {
            case 'ORDERED': return 'badge-ordered';
            case 'IN_TRANSIT': return 'badge-transit';
            case 'DELIVERED': return 'badge-delivered';
            default: return 'badge-default';
        }
    }

    async function fetchOrderDetails() {
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('id');
        const contentDiv = document.getElementById('detailsContent');

        if (!orderId) {
            contentDiv.innerHTML = '<p class="error-msg">No Order ID provided.</p>';
            return;
        }

        try {
            const response = await fetch(`${API_BASE}/orders/${orderId}/`, {
                method: 'GET',
                credentials: 'include'
            });

            if (!response.ok) throw new Error("Could not find order details.");

            const order = await response.json();

            const displayAddress = order.deliveryAddress || 'No address provided';
            const displayCard = order.cardNumber || 'N/A';
            const displayHolder = order.cardHolderName || 'Unknown Holder';

            contentDiv.innerHTML = `
                <div class="header">
                    <div>
                        <h1 class="title">Order #${order.id}</h1>
                        <p style="color: var(--muted); margin-top: 5px;">
                            Placed on ${new Date(order.orderDate).toLocaleDateString()}
                        </p>
                    </div>
                    <span class="badge ${getStatusClass(order.status)}">
                        ${order.status.replace(/_/g, ' ')}
                    </span>
                </div>

                <div class="info-grid">
                    <div class="info-section">
                        <h4>Shipping Address</h4>
                        <div class="info-content">${displayAddress}</div>
                    </div>
                    <div class="info-section">
                        <h4>Payment Method</h4>
                        <div class="info-content">
                            <strong>💳 ${displayCard}</strong><br>
                            <span style="color: var(--muted); font-size: 0.9rem;">${displayHolder}</span>
                        </div>
                    </div>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th>Book Title</th>
                            <th style="text-align: center;">Qty</th>
                            <th class="price-col">Price</th>
                            <th class="price-col">Subtotal</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${order.items && order.items.length > 0 ?
                order.items.map(item => `
                            <tr>
                                <td class="book-title">${item.bookTitle || 'Book Title Not Found'}</td>
                                <td style="text-align: center;">${item.quantity}</td>
                                <td class="price-col">$${Number(item.priceAtPurchase).toFixed(2)}</td>
                                <td class="price-col">$${(item.quantity * item.priceAtPurchase).toFixed(2)}</td>
                            </tr>
                        `).join('') : '<tr><td colspan="4" style="text-align:center;">No items found.</td></tr>'}
                    </tbody>
                </table>

                <div class="order-summary">
                    <div class="summary-row total-row">
                        <span>Total Paid</span>
                        <span>$${Number(order.totalPrice).toFixed(2)}</span>
                    </div>
                </div>
            `;
        } catch (err) {
            contentDiv.innerHTML = `<div class="error-msg">${err.message}</div>`;
            console.error("Order Details Error:", err);
        }
    }

    document.addEventListener('DOMContentLoaded', fetchOrderDetails);
</script>
</body>
</html>
