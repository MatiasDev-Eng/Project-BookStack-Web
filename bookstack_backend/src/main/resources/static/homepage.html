<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BookStack | Discover Your Next Read</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css">
  <script>
    (function() {
      const cached = localStorage.getItem('bookstack-theme');
      if (cached === 'dark') document.documentElement.classList.add('dark');
    })();
  </script>
  <style>
    .user-profile-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: none;
    }
    .user-profile-btn.has-photo img        { display: block; }
    .user-profile-btn.has-photo .nav-emoji { display: none; }

    .compare-btn {
      width: 100%;
      padding: 7px;
      margin-top: 6px;
      background: transparent;
      border: 1px solid var(--accent);
      border-radius: var(--radius-sm);
      color: var(--accent);
      font-family: var(--font-body);
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: all var(--transition);
    }
    .compare-btn:hover {
      background: var(--accent);
      color: white;
    }

    /* ── Compare modal ── */
    .compare-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 1000;
      backdrop-filter: blur(2px);
      overflow-y: auto;
      padding: 40px 20px;
    }
    .compare-modal-overlay.open { display: flex; align-items: flex-start; justify-content: center; }

    .compare-modal {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 900px;
      padding: 32px;
    }

    .compare-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .compare-modal-header h2 {
      font-family: var(--font-display);
      font-size: 1.5rem;
      margin: 0;
    }

    .compare-close-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--muted);
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      transition: background var(--transition);
    }
    .compare-close-btn:hover { background: var(--bg-subtle); }

    .compare-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    .compare-table th {
      text-align: left;
      padding: 10px 14px;
      border-bottom: 2px solid var(--border);
      color: var(--muted);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
    }

    .compare-table td {
      padding: 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    .compare-table tr:hover td { background: var(--bg-subtle); }
    body.dark .compare-table tr:hover td { background: rgba(255,255,255,0.03); }

    .best-value-row td {
      background: var(--success-bg) !important;
    }
    .best-value-badge {
      display: inline-block;
      padding: 3px 8px;
      background: var(--success);
      color: white;
      border-radius: 20px;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-left: 8px;
    }

    .star-rating {
      color: var(--accent);
      font-size: 0.9rem;
    }

    .compare-add-btn {
      padding: 7px 14px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: background var(--transition);
    }
    .compare-add-btn:hover { background: var(--accent-hover); }
    .compare-add-btn:disabled {
      background: var(--border);
      color: var(--muted);
      cursor: not-allowed;
    }

    .sort-controls {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      align-items: center;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .sort-btn {
      padding: 5px 12px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--bg-subtle);
      color: var(--primary);
      font-family: var(--font-body);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
    }
    .sort-btn:hover, .sort-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-light);
    }

    .compare-loading {
      text-align: center;
      padding: 40px;
      color: var(--muted);
    }
  </style>
</head>

<body class="preload">
<div id="notification"></div>

<nav>
  <div class="nav-left">
    <a href="homepage.html" class="logo">BookStack</a>
  </div>

  <div class="nav-center">
    <input id="searchInput" type="text" class="search-bar" placeholder="Search for titles, authors, or genres...">
    <button id="searchBtn" class="search-button">Search</button>
    <button id="filterBtn" class="filter-toggle">Filters</button>
  </div>

  <div class="nav-right">
    <a href="admin_usermanagement.html" id="adminBtn" class="publish-btn admin-btn" style="display: none;">
      🛡️ Admin
    </a>
    <a href="publish_book.html" class="publish-btn"><span>+</span> Publish Book</a>
    <div class="nav-icon-btn" onclick="window.location.href='wishlist.html'">❤️</div>
    <div class="nav-icon-btn" onclick="window.location.href='cart.html'">🛒</div>
    <div class="user-profile-btn" onclick="window.location.href='account.html'">
      <img id="navAvatar" alt="Profile">
      <span class="nav-emoji">👤</span>
    </div>
  </div>
</nav>

<div id="filterPanel" class="filter-panel">
  <h3>Filters</h3>
  <label>Min Price</label>
  <input type="number" id="minPrice" placeholder="0">
  <label>Max Price</label>
  <input type="number" id="maxPrice" placeholder="100">
  <label>Min Year</label>
  <input type="number" id="minYear" placeholder="1900">
  <label>Max Year</label>
  <input type="number" id="maxYear" placeholder="2025">
  <button id="applyFiltersBtn">Apply Filters</button>
  <button id="clearFiltersBtn" class="clear-btn">Clear Filters</button>
</div>

<section class="featured">
  <h2 id="featuredTitle">Featured Books</h2>
  <div class="book-grid" id="bookGrid">
    <div class="book-card" style="padding: 40px; text-align: center; color: var(--muted);">
      Loading books...
    </div>
  </div>
</section>

<!-- ── Compare Modal ── -->
<div id="compareModal" class="compare-modal-overlay">
  <div class="compare-modal">
    <div class="compare-modal-header">
      <h2 id="compareModalTitle">Compare Listings</h2>
      <button class="compare-close-btn" onclick="closeCompareModal()">✕</button>
    </div>

    <div class="sort-controls">
      <span>Sort by:</span>
      <button class="sort-btn active" id="sortPrice" onclick="sortListings('price')">💰 Price</button>
      <button class="sort-btn" id="sortCondition" onclick="sortListings('condition')">📗 Condition</button>
      <button class="sort-btn" id="sortRating" onclick="sortListings('rating')">⭐ Seller Rating</button>
      <button class="sort-btn" id="sortBestValue" onclick="sortListings('bestValue')">🏆 Best Value</button>
    </div>

    <div id="compareTableContainer">
      <div class="compare-loading">Loading listings...</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
<script src="notifications.js"></script>
<script src="global-init.js"></script>

<script>
  let activeFilters = { minPrice: null, maxPrice: null, minYear: null, maxYear: null };
  let compareListings = [];
  let currentSort = 'price';

  const API_BASE = `${window.location.origin}/api`;

  const CONDITION_SCORE = { 'NEW': 5, 'LIKE_NEW': 4, 'VERY_GOOD': 3, 'GOOD': 2, 'ACCEPTABLE': 1 };
  const CONDITION_LABEL = { 'NEW': 'New', 'LIKE_NEW': 'Like New', 'VERY_GOOD': 'Very Good', 'GOOD': 'Good', 'ACCEPTABLE': 'Acceptable' };

  function showNotification(message, type = "info") {
    const note = document.getElementById("notification");
    note.innerText = message;
    note.className = `notification-${type}`;
    note.style.display = "block";
    setTimeout(() => { note.style.display = "none"; }, 3000);
  }

  async function checkAdminStatus() {
    const adminBtn = document.getElementById('adminBtn');
    try {
      const response = await fetch(`${API_BASE}/auth/me/`, { credentials: 'include' });
      if (response.ok) {
        const user = await response.json();
        if (user.roles && user.roles.includes('ROLE_ADMIN')) {
          adminBtn.style.display = 'flex';
        }
        try {
          const picRes = await fetch(`${API_BASE}/me/profile-picture`, { credentials: 'include' });
          if (picRes.ok) {
            const blob       = URL.createObjectURL(await picRes.blob());
            const navAvatar  = document.getElementById('navAvatar');
            const profileBtn = document.querySelector('.user-profile-btn');
            navAvatar.src    = blob;
            navAvatar.onload = () => profileBtn.classList.add('has-photo');
          }
        } catch (e) { /* no picture */ }
      }
    } catch (error) {
      console.warn("User not logged in or session expired.");
    }
  }

  function updateQty(event, btn, delta, maxStock) {
    event.stopPropagation();
    const qtySpan = btn.parentElement.querySelector('.qty-num');
    let currentQty = parseInt(qtySpan.innerText);
    currentQty = Math.max(1, Math.min(maxStock, currentQty + delta));
    qtySpan.innerText = currentQty;
  }

  async function addToCart(event, bookId) {
    event.stopPropagation();
    const qty = parseInt(document.getElementById(`qty-${bookId}`).innerText);
    try {
      const response = await fetch(`${API_BASE}/cart/add/`, {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ bookId: bookId, quantity: qty })
      });
      if (response.ok) {
        showNotification("Added to cart!", "success");
      } else {
        showNotification("Failed to add to cart.", "error");
      }
    } catch (error) {
      console.error("Cart error:", error);
    }
  }

  // ── Compare tool ──────────────────────────────────────────
  function scoreBook(book) {
    // Normalize price (lower = better): invert so higher score = better
    const prices = compareListings.map(b => parseFloat(b.price));
    const maxPrice = Math.max(...prices);
    const minPrice = Math.min(...prices);
    const priceRange = maxPrice - minPrice || 1;
    const priceScore = (maxPrice - parseFloat(book.price)) / priceRange; // 0-1, higher = cheaper

    // Condition score (0-1)
    const condScore = (CONDITION_SCORE[book.condition] || 1) / 5;

    // Seller rating score (0-1)
    const ratingScore = (book.sellerRating || 0) / 5;

    // Weighted: 50% price, 30% condition, 20% seller rating
    return (priceScore * 0.5) + (condScore * 0.3) + (ratingScore * 0.2);
  }

  function renderStars(rating) {
    if (!rating || rating === 0) return '<span style="color:var(--muted); font-size:0.82rem;">No ratings</span>';
    const filled = Math.round(rating);
    return `<span class="star-rating">${'★'.repeat(filled)}${'☆'.repeat(5 - filled)}</span>
            <span style="font-size:0.8rem; color:var(--muted); margin-left:4px;">${rating.toFixed(1)}</span>`;
  }

  function sortListings(by) {
    currentSort = by;
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`sort${by.charAt(0).toUpperCase() + by.slice(1)}`).classList.add('active');

    let sorted = [...compareListings];
    if (by === 'price') sorted.sort((a, b) => parseFloat(a.price) - parseFloat(b.price));
    else if (by === 'condition') sorted.sort((a, b) => (CONDITION_SCORE[b.condition] || 0) - (CONDITION_SCORE[a.condition] || 0));
    else if (by === 'rating') sorted.sort((a, b) => (b.sellerRating || 0) - (a.sellerRating || 0));
    else if (by === 'bestValue') sorted.sort((a, b) => scoreBook(b) - scoreBook(a));

    renderCompareTable(sorted);
  }

  function renderCompareTable(listings) {
    const container = document.getElementById('compareTableContainer');

    if (!listings || listings.length === 0) {
      container.innerHTML = '<div class="compare-loading">No other listings found for this title.</div>';
      return;
    }

    // Find best value index
    const scored = listings.map(b => scoreBook(b));
    const bestIdx = scored.indexOf(Math.max(...scored));

    container.innerHTML = `
      <table class="compare-table">
        <thead>
          <tr>
            <th>Seller</th>
            <th>Price</th>
            <th>Condition</th>
            <th>Seller Rating</th>
            <th>Stock</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          ${listings.map((book, i) => {
            const isBest = i === bestIdx;
            const inStock = (book.stock ?? 0) > 0;
            return `
              <tr class="${isBest ? 'best-value-row' : ''}">
                <td>
                  <strong>${book.ownerUsername}</strong>
                  ${isBest ? '<span class="best-value-badge">🏆 Best Value</span>' : ''}
                </td>
                <td style="font-weight:800; color:var(--price);">$${parseFloat(book.price).toFixed(2)}</td>
                <td>${CONDITION_LABEL[book.condition] || book.condition || 'N/A'}</td>
                <td>${renderStars(book.sellerRating)}</td>
                <td style="color:${inStock ? 'var(--success)' : 'var(--danger)'}; font-weight:700;">
                  ${inStock ? `In Stock (${book.stock})` : 'Out of Stock'}
                </td>
                <td>
                  <div style="display:flex; gap:6px;">
                    <button class="compare-add-btn" ${!inStock ? 'disabled' : ''}
                      onclick="addToCartFromCompare(event, ${book.bookId})">
                      🛒 Add
                    </button>
                    <button class="compare-add-btn" style="background:var(--bg-subtle); color:var(--primary); border:1px solid var(--border);"
                      onclick="window.location.href='book_details.html?id=${book.bookId}'">
                      View
                    </button>
                  </div>
                </td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
    `;
  }

  async function openCompareModal(event, title) {
    event.stopPropagation();
    document.getElementById('compareModalTitle').textContent = `Compare: "${title}"`;
    document.getElementById('compareTableContainer').innerHTML = '<div class="compare-loading">Loading listings...</div>';
    document.getElementById('compareModal').classList.add('open');
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('sortPrice').classList.add('active');

    try {
      const res = await fetch(`${API_BASE}/books/compare?title=${encodeURIComponent(title)}`, { credentials: 'include' });
      if (!res.ok) throw new Error('Failed to load');
      const listings = await res.json();

      // Fetch seller ratings for each unique owner
      const ownerIds = [...new Set(listings.map(b => b.ownerId))];
      const ratingMap = {};
      await Promise.all(ownerIds.map(async ownerId => {
        try {
          const rRes = await fetch(`${API_BASE}/books/seller-rating/${ownerId}`, { credentials: 'include' });
          if (rRes.ok) ratingMap[ownerId] = await rRes.json();
          else ratingMap[ownerId] = 0;
        } catch (e) { ratingMap[ownerId] = 0; }
      }));

      compareListings = listings.map(b => ({ ...b, sellerRating: ratingMap[b.ownerId] || 0 }));
      sortListings('price');

    } catch (err) {
      document.getElementById('compareTableContainer').innerHTML =
        '<div class="compare-loading" style="color:var(--danger);">Failed to load listings.</div>';
    }
  }

  function closeCompareModal() {
    document.getElementById('compareModal').classList.remove('open');
    compareListings = [];
  }

  async function addToCartFromCompare(event, bookId) {
    event.stopPropagation();
    try {
      const res = await fetch(`${API_BASE}/cart/add/`, {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ bookId, quantity: 1 })
      });
      if (res.ok) {
        showNotification("Added to cart!", "success");
        closeCompareModal();
      } else {
        showNotification("Failed to add to cart.", "error");
      }
    } catch (e) {
      showNotification("Network error.", "error");
    }
  }

  // Close modal on overlay click
  document.getElementById('compareModal').addEventListener('click', function(e) {
    if (e.target === this) closeCompareModal();
  });

  // ── Fetch books ───────────────────────────────────────────
  async function fetchFeaturedBooks(searchQuery, minPrice, maxPrice, minYear, maxYear) {
    const bookGrid = document.getElementById('bookGrid');
    if (searchQuery) document.getElementById('featuredTitle').innerText = `Results for "${searchQuery}"`;

    try {
      let url;
      const hasFilters = searchQuery || minPrice || maxPrice || minYear || maxYear;

      if (hasFilters) {
        url = `${API_BASE}/books/search?query=${searchQuery || ""}`;
        if (minPrice) url += `&minPrice=${minPrice}`;
        if (maxPrice) url += `&maxPrice=${maxPrice}`;
        if (minYear)  url += `&minYear=${minYear}`;
        if (maxYear)  url += `&maxYear=${maxYear}`;
      } else {
        url = `${API_BASE}/books/`;
      }

      const response = await fetch(url, { credentials: 'include' });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);

      const books = await response.json();
      bookGrid.innerHTML = '';

      const list = hasFilters ? books : books.slice(0, 16);

      // Group by title for compare button — only show in search results
      const titleGroups = {};
      if (hasFilters) {
        list.forEach(book => {
          const key = book.title.toLowerCase();
          if (!titleGroups[key]) titleGroups[key] = [];
          titleGroups[key].push(book);
        });
      }

      list.forEach(book => {
        const stockNum = book.stock ?? 0;
        const card = document.createElement('div');
        card.className = 'book-card';
        card.onclick = () => { window.location.href = `book_details.html?id=${book.bookId}`; };

        const titleKey = book.title.toLowerCase();
        const hasMultipleListings = hasFilters && titleGroups[titleKey] && titleGroups[titleKey].length > 1;

        card.innerHTML = `
          <div class="book-cover" style="padding:0; overflow:hidden;">
            ${book.hasCover
              ? `<img src="${API_BASE}/books/${book.bookId}/cover"
                      alt="${book.title}"
                      style="width:100%; height:100%; object-fit:cover;"
                      onerror="this.parentElement.innerHTML='📖'">`
              : `📖`}
          </div>
          <div class="book-info">
            <div class="book-title">${book.title}</div>
            <div class="book-author">by ${book.author}</div>
            <div class="book-author" style="font-size:0.78rem;">
                Sold by <a href="#" style="color:var(--accent); font-weight:600;" onclick="event.stopPropagation()">
                    ${book.ownerUsername || 'Unknown'}
                </a>
            </div>
            <div class="book-price">$${book.price.toFixed(2)}</div>
            <div class="cart-controls">
              ${stockNum > 0 ? `
                <div style="font-size:0.8rem; font-weight:700; color:var(--success); margin-bottom:4px;">
                  In Stock: ${stockNum}
                </div>
                <div class="quantity-selector">
                  <button class="qty-btn" onclick="updateQty(event, this, -1, ${stockNum})">−</button>
                  <span class="qty-num" id="qty-${book.bookId}">1</span>
                  <button class="qty-btn" onclick="updateQty(event, this, 1, ${stockNum})">+</button>
                </div>
                <button class="add-to-cart-btn" onclick="addToCart(event, ${book.bookId})">Add to Cart</button>
              ` : `
                <div style="padding:8px; background:var(--danger-bg); border-radius:var(--radius-sm); color:var(--danger); font-weight:700; font-size:0.85rem; text-align:center;">
                  Out of Stock
                </div>
              `}
              ${hasMultipleListings ? `
                <button class="compare-btn" onclick="openCompareModal(event, '${book.title.replace(/'/g, "\\'")}')">
                  ⚖️ Compare ${titleGroups[titleKey].length} Listings
                </button>
              ` : ''}
            </div>
          </div>
        `;
        bookGrid.appendChild(card);
      });

      document.getElementById("minPrice").value = activeFilters.minPrice ?? "";
      document.getElementById("maxPrice").value = activeFilters.maxPrice ?? "";
      document.getElementById("minYear").value  = activeFilters.minYear  ?? "";
      document.getElementById("maxYear").value  = activeFilters.maxYear  ?? "";

    } catch (error) {
      bookGrid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--danger);">Failed to load books.</div>`;
    }
  }

  // ── DOMContentLoaded ──────────────────────────────────────
  window.addEventListener('DOMContentLoaded', () => {
    const params      = new URLSearchParams(window.location.search);
    const searchQuery = params.get("search");
    const minPrice    = params.get("minPrice");
    const maxPrice    = params.get("maxPrice");
    const minYear     = params.get("minYear");
    const maxYear     = params.get("maxYear");

    activeFilters = { minPrice, maxPrice, minYear, maxYear };

    document.getElementById("filterBtn").addEventListener("click", () => {
      document.getElementById("filterPanel").classList.toggle("open");
    });

    document.getElementById("searchBtn").addEventListener("click", () => {
      const query = document.getElementById("searchInput").value.trim();
      window.location.href = `homepage.html?search=${encodeURIComponent(query)}`;
    });

    document.getElementById("searchInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        const query = document.getElementById("searchInput").value.trim();
        window.location.href = `homepage.html?search=${encodeURIComponent(query)}`;
      }
    });

    document.getElementById("applyFiltersBtn").addEventListener("click", () => {
      const query = document.getElementById("searchInput").value.trim();
      activeFilters.minPrice = document.getElementById("minPrice").value || null;
      activeFilters.maxPrice = document.getElementById("maxPrice").value || null;
      activeFilters.minYear  = document.getElementById("minYear").value  || null;
      activeFilters.maxYear  = document.getElementById("maxYear").value  || null;

      let url = `homepage.html?search=${encodeURIComponent(query)}`;
      if (activeFilters.minPrice) url += `&minPrice=${activeFilters.minPrice}`;
      if (activeFilters.maxPrice) url += `&maxPrice=${activeFilters.maxPrice}`;
      if (activeFilters.minYear)  url += `&minYear=${activeFilters.minYear}`;
      if (activeFilters.maxYear)  url += `&maxYear=${activeFilters.maxYear}`;
      window.location.href = url;
    });

    document.getElementById("clearFiltersBtn").addEventListener("click", () => {
      activeFilters = { minPrice: null, maxPrice: null, minYear: null, maxYear: null };
      document.getElementById("minPrice").value = "";
      document.getElementById("maxPrice").value = "";
      document.getElementById("minYear").value  = "";
      document.getElementById("maxYear").value  = "";
      const query = document.getElementById("searchInput").value.trim();
      window.location.href = `homepage.html?search=${encodeURIComponent(query)}`;
    });

    checkAdminStatus();
    fetchFeaturedBooks(searchQuery, minPrice, maxPrice, minYear, maxYear);
  });

  // ── Theme ─────────────────────────────────────────────────
  async function applyTheme() {
    const cached = localStorage.getItem('bookstack-theme');
    if (cached) {
      const isDark = cached === 'dark';
      document.body.classList.toggle("dark", isDark);
      document.documentElement.classList.toggle("dark", isDark);
    }
    const hasCookie = document.cookie.includes('bookstack-jwt');
    if (!hasCookie) { document.body.classList.remove("preload"); return; }
    try {
      const res = await fetch(`${API_BASE}/me/`, { credentials: 'include' });
      if (!res.ok) { document.body.classList.remove("preload"); return; }
      const user   = await res.json();
      const theme  = (user.themePreference || "light").toLowerCase().trim();
      const isDark = theme === "dark";
      localStorage.setItem('bookstack-theme', theme);
      document.body.classList.toggle("dark", isDark);
      document.documentElement.classList.toggle("dark", isDark);
    } catch (err) {
      console.error("Theme load failed", err);
    }
    document.body.classList.remove("preload");
  }

  applyTheme();
</script>
</body>
</html>
